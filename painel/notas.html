<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas metodológicas · Painel APS</title>
<link rel="icon" href="/img/painelaps.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2F8FD8;outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap">
<script>(function(){if(new URLSearchParams(location.search).get('incorporado')==='1')document.documentElement.setAttribute('data-incorporado','1');})();</script>
<style>html[data-incorporado] #barra-painel,html[data-incorporado] #sub-painel,html[data-incorporado] #rodape-aps{display:none!important}html[data-incorporado] body{background:transparent}</style>
<style>#aviso{font:16px/1.5 'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 24px;color:#14212B}#aviso a{color:#0E5E8C}</style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F3C72" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Painel APS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/mobile.css" />
    <link rel="stylesheet" href="/css/carregando.css" />
    <script src="/js/publico/mobile.js" defer></script>
</head>
<body>
<!-- Gerado por scripts/gerar-notas.py a partir de desenho/Notas.dc.html. Não edite à mão. -->
<div id="tela"><div class="carr-tela" role="status" aria-live="polite"><div class="carr-marca"><img src="/img/painelaps.svg" alt="" width="40" height="40"><span>Painel APS</span></div><div class="carr-barras" aria-hidden="true"><i></i><i></i><i></i></div><p id="aviso">Carregando os indicadores coletados…</p></div></div>
<template id="modelo">
<div style="min-height: 100vh; background: {{tPagina}}; color: {{tTexto}}; font-family: {{tFonte}}; font-weight: {{tPeso}}; font-size: {{tTam}}; line-height: 1.5; color-scheme: {{tEsquema}}">

  <div id="barra-painel" style="background: #1F3C72; color: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif">
    <div style="max-width: 1360px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="/" style="display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 19px; color: #FFFFFF; text-decoration: none"><img src="/img/painelaps.svg" alt="" width="34" height="34"><span>Painel APS</span></a>
      <nav aria-label="Áreas do Painel" style="display: flex; flex-wrap: nowrap; white-space: nowrap; align-items: center; gap: 2px 2px; font-weight: 600; font-size: 13.5px">
        <details style="position: relative"><summary style="color: #FFFFFF; padding: 8px 8px; min-height: 36px; display: inline-flex; align-items: center; border-radius: 99px; cursor: pointer; list-style: none; background: rgba(255,255,255,.22)">Acompanhamentos ▾</summary>
          <div style="position: absolute; z-index: 20; top: 100%; left: 0; min-width: 230px; margin-top: 6px; background: #FFFFFF; border: 2px solid #D5DCE8; border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(20,33,43,.18); display: flex; flex-direction: column">
            <a href="/" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap">Visão geral</a>
            <a href="/notas" aria-current="page" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap; background: #D9ECF8">Federal</a>
            <a href="/estadual" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap">Estadual</a>
            <a href="/municipal" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap">Municipal</a></div></details>
        <template data-sc="for" list="{{menuSite}}" as="ms"><a href="{{ms.href}}" style="color: #FFFFFF; text-decoration: none; padding: 8px 8px; min-height: 36px; display: inline-flex; align-items: center; border-radius: 99px; background: {{ms.fundo}}">{{ms.txt}}</a></template>
        <template data-sc="if" value="{{temLanc}}"><details style="position: relative"><summary style="color: #FFFFFF; padding: 8px 8px; min-height: 36px; display: inline-flex; align-items: center; border-radius: 99px; cursor: pointer; list-style: none">Lançamentos ▾</summary>
          <div style="position: absolute; z-index: 20; top: 100%; left: 0; min-width: 230px; margin-top: 6px; background: #FFFFFF; border: 2px solid #D5DCE8; border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(20,33,43,.18); display: flex; flex-direction: column">
            <a href="/lancamentos" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap">Metas do PAS</a>
            <a href="/lancamentos-vacinas" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap">Coberturas vacinais</a>
            <a href="/estadual#t-form" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap">Cofinanciamento estadual</a></div></details></template>
      </nav>
      <div role="group" aria-label="Tema" style="display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid rgba(255,255,255,.35); border-radius: 99px"><button type="button" onClick="{{tClaro}}" aria-pressed="{{pClaro}}" title="Tema claro" aria-label="Tema claro" style="all: unset; box-sizing: border-box; width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; color: #FFFFFF; opacity: {{pClaroOp}}; background: {{pClaroBg}}"><span aria-hidden="true" style="font-size: 15px; line-height: 1">☀</span></button><button type="button" onClick="{{tPers}}" aria-pressed="{{pPers}}" title="Tema personalizado (cores de Cajamar)" aria-label="Tema personalizado (cores de Cajamar)" style="all: unset; box-sizing: border-box; width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; color: #FFFFFF; opacity: {{pPersOp}}; background: {{pPersBg}}"><span aria-hidden="true" style="font-size: 15px; line-height: 1">◐</span></button><button type="button" onClick="{{tEsc}}" aria-pressed="{{pEsc}}" title="Tema escuro" aria-label="Tema escuro" style="all: unset; box-sizing: border-box; width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; color: #FFFFFF; opacity: {{pEscOp}}; background: {{pEscBg}}"><span aria-hidden="true" style="font-size: 15px; line-height: 1">☾</span></button></div>
      <template data-sc="if" value="{{temUsuario}}"><details style="position: relative; font-size: 13px; font-weight: 600"><summary style="list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.6); border-radius: 99px; padding: 4px 12px 4px 4px; min-height: 36px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #00A7E7; display: inline-grid; place-items: center; font-weight: 800">{{usuarioInicial}}</span>{{usuarioNome}} ▾</summary>
        <div style="position: absolute; z-index: 30; right: 0; top: 100%; margin-top: 6px; min-width: 260px; background: #FFFFFF; color: #1B2340; border: 2px solid #D5DCE8; border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(20,33,43,.18); display: flex; flex-direction: column; font-size: 14px">
          <template data-sc="for" list="{{itensUsuario}}" as="iu"><a href="{{iu.href}}" style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: {{iu.peso}}">{{iu.txt}}</a></template>
          <button type="button" onClick="{{sair}}" style="font: inherit; color: #1B2340; background: none; border: 0; border-top: 1px solid #E3E8F0; margin-top: 6px; text-align: left; padding: 10px 12px 8px; cursor: pointer">Sair</button></div></details></template>
    </div>
  </div>
  <nav id="sub-painel" aria-label="Cofinanciamento federal" style="background: #163059; border-bottom: 4px solid #00A7E7; font-family: 'Montserrat', system-ui, sans-serif">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 28px; font-weight: 600; font-size: 14px">
      <a href="/notas" aria-current="page" style="color: #FFFFFF; text-decoration: none; padding: 10px 0 9px; border-bottom: 3px solid #FFFFFF; margin-bottom: -4px">Dashboard</a>
      <a href="{{linkDados}}" title="Tabelas para conferir os números, no mesmo período e recorte" style="color: rgba(255,255,255,.82); text-decoration: none; padding: 10px 0 9px; border-bottom: 3px solid transparent; margin-bottom: -4px">Dados</a>
    </div>
  </nav>
  <header style="background: {{tTopoFundo}}; color: {{tTopoTexto}}; border-bottom: {{tTopoBorda}}">
    <div class="m-cab" style="max-width: 1280px; margin: 0 auto; padding: 14px 24px 0; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="display: flex; flex-direction: column; line-height: 1.25">
            <span style="font-weight: {{tPesoForte}}; font-size: 17px">Notas metodológicas</span>
            <span class="so-largo" style="font-size: 13px; color: {{tTopoSuave}}">Cofinanciamento federal da APS · {{subtituloTopo}}</span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
          <span style="font-size: 12px; font-weight: 600; color: {{tRascunhoTexto}}; background: {{tRascunhoFundo}}; border-radius: 999px; padding: 3px 10px" class="m-selo"><span class="{{coletaPreCls}}">{{coletaPre}}</span>{{coletaTxt}}</span>
          
        </div>
      </div>
      <nav aria-label="Relatórios" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 28px">
        <template data-sc="for" list="{{relatorios}}" as="rl" hint-placeholder-count="4">
          <button type="button" onClick="{{rl.escolher}}" aria-pressed="{{rl.pressionado}}" style="font: inherit; font-size: 16px; background: transparent; border: 0; border-bottom: 3px solid {{rl.borda}}; padding: 8px 0 9px; cursor: pointer; color: {{rl.cor}}; font-weight: {{rl.peso}}">{{rl.titulo}}</button>
        </template>
      </nav>
    </div>
  </header>

  <div class="m-filtros" style="position: {{posFiltros}}; top: 0; z-index: 3; background: {{tPagina}}; border-bottom: 1px solid {{tBorda}}">
    <template data-sc="if" value="{{filtrosAbertos}}">
    <div role="search" aria-label="Filtros" style="max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 10px">

      <span class="fx-tit fx-tit-per" style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: {{tSuave}}">Período</span>
      <div role="group" aria-label="Tipo de intervalo" class="fx-intervalo" style="display: flex; border: 1px solid {{tControle}}; border-radius: 8px; overflow: hidden; background: {{tCartao}}">
        <template data-sc="for" list="{{opcoesIntervalo}}" as="oi" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{oi.pressionado}}" onClick="{{oi.escolher}}" style="font: inherit; min-height: 42px; padding: 0 14px; border: 0; cursor: pointer; background: {{oi.fundo}}; color: {{oi.cor}}; font-weight: {{oi.peso}}">{{oi.rotulo}}</button>
        </template>
      </div>
      <div class="fx-tempo" style="position: relative">
        <button type="button" onClick="{{abrirTempo}}" aria-expanded="{{tempoExp}}" aria-label="{{rotuloSelTempo}}: {{tituloTempo}}" title="{{tituloTempo}}" style="font: inherit; min-height: 44px; width: 220px; padding: 0 12px; border: 1px solid {{tempoBorda}}; border-radius: 8px; background: {{tCartao}}; color: {{tTexto}}; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left">
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{resumoTempo}}</span>
          <span aria-hidden="true" style="font-size: 11px; color: {{tSuave}}">▾</span>
        </button>
        <template data-sc="if" value="{{painelTempo}}" hint-placeholder-val="{{false}}">
          <div role="group" aria-label="{{rotuloSelTempo}}" style="position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: {{larguraPainelTempo}}; box-sizing: border-box; padding: 12px; background: {{tCartao}}; border: 1px solid {{tBorda}}; border-radius: 10px; box-shadow: 0 10px 28px rgba(15, 30, 50, .16); display: flex; flex-direction: column; gap: 10px">
            <template data-sc="if" value="{{temNavAno}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; align-items: center; justify-content: space-between">
                <button type="button" onClick="{{anoAntes}}" aria-label="Ano anterior" style="font: inherit; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{tTexto}}; cursor: pointer; opacity: {{opAntes}}">‹</button>
                <span style="font-weight: {{tPesoForte}}">{{anoPainel}}</span>
                <button type="button" onClick="{{anoDepois}}" aria-label="Próximo ano" style="font: inherit; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{tTexto}}; cursor: pointer; opacity: {{opDepois}}">›</button>
              </div>
            </template>
            <div style="display: grid; grid-template-columns: {{gradePainelTempo}}; gap: 6px">
              <template data-sc="for" list="{{itensTempo}}" as="mm" hint-placeholder-count="12">
                <button type="button" aria-pressed="{{mm.pressionado}}" aria-disabled="{{mm.inativo}}" onClick="{{mm.alternar}}" title="{{mm.titulo}}" style="font: inherit; font-size: 14px; min-height: 38px; padding: 4px 10px; border-radius: 8px; border: {{mm.borda}}; background: {{mm.fundo}}; color: {{mm.cor}}; font-weight: {{mm.peso}}; cursor: {{mm.cursor}}; opacity: {{mm.op}}; text-align: left; display: flex; align-items: center; justify-content: {{mm.alinha}}; gap: 8px">
                  <span>{{mm.rot}}</span><span style="font-size: 12px; font-weight: 400; opacity: .8">{{mm.sub}}</span>
                </button>
              </template>
            </div>
            <button type="button" onClick="{{fecharPainelF}}" style="align-self: flex-end; font: inherit; font-size: 14px; min-height: 36px; padding: 0 14px; border: 1px solid {{tControle}}; border-radius: 8px; background: transparent; color: {{tTexto}}; cursor: pointer">Pronto</button>
          </div>
        </template>
      </div>

      <span class="fx-tit fx-tit-rec" style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: {{tSuave}}">Recorte</span>
      <div role="group" aria-label="Visualização" class="fx-visao" style="display: flex; margin-left: 14px; border: 1px solid {{tControle}}; border-radius: 8px; overflow: hidden; background: {{tCartao}}">
        <template data-sc="for" list="{{opcoesVisao}}" as="ov" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{ov.pressionado}}" onClick="{{ov.escolher}}" style="font: inherit; min-height: 42px; padding: 0 14px; border: 0; cursor: pointer; background: {{ov.fundo}}; color: {{ov.cor}}; font-weight: {{ov.peso}}">{{ov.rotulo}}</button>
        </template>
      </div>
      <template data-sc="if" value="{{temLocais}}" hint-placeholder-val="{{false}}">
        <div class="fx-locais" style="position: relative">
          <button type="button" onClick="{{abrirLocais}}" aria-expanded="{{locaisExp}}" aria-label="{{rotuloSelLocais}}: {{tituloLocais}}" title="{{tituloLocais}}" style="font: inherit; min-height: 44px; width: 190px; padding: 0 12px; border: 1px solid {{locaisBorda}}; border-radius: 8px; background: {{tCartao}}; color: {{tTexto}}; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{resumoLocais}}</span>
            <span aria-hidden="true" style="font-size: 11px; color: {{tSuave}}">▾</span>
          </button>
          <template data-sc="if" value="{{painelLocais}}" hint-placeholder-val="{{false}}">
            <div role="group" aria-label="{{rotuloSelLocais}}" style="position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: 360px; box-sizing: border-box; padding: 8px 12px 12px; background: {{tCartao}}; border: 1px solid {{tBorda}}; border-radius: 10px; box-shadow: 0 10px 28px rgba(15, 30, 50, .16); display: flex; flex-direction: column; gap: 8px">
              <div style="max-height: 380px; overflow-y: auto; display: flex; flex-direction: column">
                <template data-sc="for" list="{{itensLocais}}" as="li" hint-placeholder-count="11">
                  <template data-sc="if" value="{{li.cab}}" hint-placeholder-val="{{false}}">
                    <span style="font-size: 12px; font-weight: 600; color: {{tSuave}}; padding: 10px 0 2px">{{li.rotulo}}</span>
                  </template>
                  <template data-sc="if" value="{{li.item}}" hint-placeholder-val="{{true}}">
                    <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; cursor: pointer; font-size: 14px">
                      <input type="checkbox" checked="{{li.marcado}}" onChange="{{li.alternar}}" style="width: 16px; height: 16px; margin: 0; flex: none; accent-color: {{tAtivoFundo}}">
                      <span>{{li.rotulo}} <span style="color: {{tSuave}}">{{li.sub}}</span></span>
                    </label>
                  </template>
                </template>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid {{tDivisa}}; padding-top: 10px">
                <span style="font-size: 13px; color: {{tSuave}}">{{contagemLocais}}</span>
                <button type="button" onClick="{{fecharPainelF}}" style="font: inherit; font-size: 14px; min-height: 36px; padding: 0 14px; border: 1px solid {{tControle}}; border-radius: 8px; background: transparent; color: {{tTexto}}; cursor: pointer">Pronto</button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <span class="fx-tit fx-tit-comp" style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: {{tSuave}}">Comparação</span>
      <label class="fx-comparar" title="{{tituloComparar}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; margin-left: 14px; cursor: pointer">
        <input type="checkbox" checked="{{rascComparar}}" onChange="{{alternarComparar}}" aria-label="{{tituloComparar}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{tAtivoFundo}}">
        <span>Comparar</span>
      </label>

      <div class="fx-acoes" style="display: flex; align-items: center; gap: 8px; margin-left: auto"><template data-sc="if" value="{{temCancelar}}"><button type="button" onClick="{{cancelarFiltros}}" style="font: inherit; min-height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: {{tTexto}}; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Cancelar</button></template>
      <button type="button" onClick="{{atualizar}}" aria-disabled="{{atualizarInativo}}" title="{{tituloAtualizar}}" style="font: inherit; margin-left: auto; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid {{btnBorda}}; background: {{btnFundo}}; color: {{btnCor}}; font-weight: 600; cursor: {{btnCursor}}">Buscar</button></div>
    </div>
    </template>
    <template data-sc="if" value="{{filtrosFechados}}">
    <div class="filtros-resumo" onClick="{{abrirFiltros}}" style="max-width: 1280px; margin: 0 auto; padding: 8px 24px; min-height: 44px; display: flex; align-items: center; gap: 8px 12px; cursor: pointer">
      <button type="button" class="fr-botao" aria-expanded="false" aria-label="Alterar filtros: {{resumoFiltrosTxt}}" style="font: inherit; flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border: 1px solid {{tControle}}; border-radius: 8px; background: {{tCartao}}; color: {{tTexto}}; font-weight: 600; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4Z"/></svg>Filtros<span aria-hidden="true" style="font-size: 11px; color: {{tSuave}}">▾</span></button>
      <div class="fr-chips" aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 6px; min-width: 0">
        <template data-sc="for" list="{{chipsFiltros}}" as="cf"><span style="font-size: 14px; padding: 5px 12px; border-radius: 999px; background: {{tRealce}}; border: 1px solid {{tDivisa}}; color: {{tTexto}}; white-space: nowrap">{{cf}}</span></template>
      </div>
    </div>
    </template>
  </div>

  <main class="m-main" style="max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 4px; max-width: 980px">
      <h1 style="margin: 0; font-size: 30px; font-weight: {{tPesoTitulo}}; line-height: 1.2; color: {{tTitulo}}">{{pergunta}}</h1>
      <p class="{{descCls}}" style="margin: 0; color: {{tSuave}}">{{descricao}}</p>
    </div>

    <div class="m-faixa" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
      <template data-sc="for" list="{{resumo}}" as="r" hint-placeholder-count="3">
        <div style="background: {{tCartao}}; border: 1px solid {{tBorda}}; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 28px; font-weight: {{tPesoForte}}; line-height: 1.15; color: {{tTitulo}}; font-variant-numeric: tabular-nums">{{r.grande}}</span>
          <span style="font-size: 15px; color: {{tSuave}}">{{r.texto}}</span>
        </div>
      </template>
    </div>

    <section aria-labelledby="t-lista" style="background: {{tCartao}}; border: 1px solid {{tBorda}}; border-radius: 12px; padding: 18px 20px 6px; display: flex; flex-direction: column">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; padding-bottom: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 480px">
          <div style="display: flex; align-items: center; gap: 10px">
            <h2 id="t-lista" style="margin: 0; font-size: 20px; font-weight: {{tPesoForte}}; color: {{tTitulo}}">{{tituloLista}}</h2>

<script>
let REAL = null, USUARIO = null;
const ITENS_USUARIO = () => {
  if (!USUARIO) return [];
  const ls = [['/perfil', 'Meu perfil']];
  if (USUARIO.origem === 'senha') ls.push(['/trocar-senha', 'Trocar senha']);
  ls.push(['/ajuda', 'Ajuda e como ler os indicadores']);
  if (USUARIO.perfil === 'admin') ls.push(['', 'Configurações'], ['/usuarios', 'Usuários'], ['/monitoramento', 'Monitoramento das coletas'], ['/comunicados', 'Comunicados'], ['/publicacao', 'Página pública'], ['/chaves', 'Chaves da extensão'], ['/extensao', 'Extensões do Chrome'], ['/historico', 'Histórico de acessos'], ['/backups', 'Backups']);
  return ls.map(([href, txt]) => ({ href: href || '#', txt, peso: href ? 600 : 800 }));
};
// Mês e recorte entre o Dashboard e os Dados: ?de=AAAA-MM&ate=AAAA-MM&un=unidade&eq=unidade|equipe (o mesmo formato nas duas páginas).
// Troca animada entre filtros abertos e recolhidos (View Transitions do navegador; sem suporte ou com "menos movimento", troca direto).
const TRANSICAO = (fn) => {
  const menos = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!document.startViewTransition || menos) return fn();
  const r = document.documentElement;
  r.classList.add('vt-filtros');
  const t = document.startViewTransition(fn);
  const fim = () => r.classList.remove('vt-filtros');
  t.ready.catch(() => {});
  t.finished.then(fim, fim);
};
// Filtros já escolhidos nesta aba: ao voltar ao dashboard, eles abrem recolhidos.
const FILTROS_JA = (marcar) => {
  try {
    if (marcar) sessionStorage.setItem('painelaps.notasFiltros', '1');
    return sessionStorage.getItem('painelaps.notasFiltros') === '1';
  } catch (_) {
    return !!marcar;
  }
};
const CTX_INICIAL = () => {
  const q = new URLSearchParams(location.search), o = {};
  const num = (c) => (/^\d{4}-\d{2}$/.test(c || '') ? +c.slice(0, 4) * 12 + +c.slice(5, 7) - 1 : null);
  const de = num(q.get('de')), ate = num(q.get('ate')) ?? de;
  if (de !== null && ate !== null) {
    const ms = [];
    for (let a = Math.min(de, ate); a <= Math.max(de, ate); a++) if (REAL.temMes(a)) ms.push(a);
    if (ms.length) Object.assign(o, { intervalo: 'mensal', meses: ms });
  }
  const un = q.get('un'), eq = q.get('eq');
  if (eq && eq.indexOf('|') > 0 && REAL.unidades.indexOf(eq.split('|')[0]) >= 0) Object.assign(o, { visao: 'equipes', equipes: [eq] });
  else if (un && REAL.unidades.indexOf(un) >= 0) Object.assign(o, { visao: 'unidades', unidades: [un] });
  return o;
};
const LINK_DADOS = (st) => {
  const mes = (a) => Math.floor(a / 12) + '-' + String((a % 12) + 1).padStart(2, '0');
  let ms = st.intervalo === 'quad'
    ? (st.quads || []).flatMap((qd) => { const [y, k] = String(qd).split('-').map(Number); return [0, 1, 2, 3].map((i) => y * 12 + (k - 1) * 4 + i); })
    : (st.meses || []);
  ms = ms.filter((a) => REAL.temMes(a));
  const p = new URLSearchParams();
  if (ms.length) { p.set('de', mes(Math.min(...ms))); p.set('ate', mes(Math.max(...ms))); }
  const hm = new URLSearchParams(location.search).get('homolog');
  if (hm === 'homologadas' || hm === 'nao') p.set('homolog', hm);
  if (st.visao === 'unidades' && (st.unidades || []).length === 1) p.set('un', st.unidades[0]);
  if (st.visao === 'equipes' && (st.equipes || []).length === 1) { p.set('un', st.equipes[0].split('|')[0]); p.set('eq', st.equipes[0]); }
  const s = p.toString();
  return '/indicadores' + (s ? '?' + s : '');
};
const MENU_SITE = () => [['/composicao', 'Composição de Usuários'], ['/coleta', 'Como coletamos']].concat(USUARIO && (USUARIO.perfil === 'admin' || USUARIO.perfil === 'gestor') ? [['/filas', 'Filas e faltas'], ['/pendencias', 'Pendências']] : []).map(([href, txt]) => ({ href, txt, fundo: location.pathname.replace(/\.html$/, '') === href ? 'rgba(255,255,255,.22)' : 'transparent' }));
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // out/2026 = 2026 × 12 + 9 = 24321.
    this.state = { tema: '', rel: 'geral', intervalo: 'mensal', meses: [REAL.atual], quads: [REAL.quadAtual], visao: 'municipio', unidades: [], equipes: [], comparar: false,
      aplicado: null, painelF: '', atualizadoEm: '', nota: 'C4', aberta: '', abertas: {}, ocultas: {}, painel: false, info: '' };
    Object.assign(this.state, CTX_INICIAL());
    this.state.filtrosAbertos = !Object.keys(CTX_INICIAL()).length && !FILTROS_JA();
    this.state.jaRecolheu = !this.state.filtrosAbertos;
    this.state.aplicado = Component.pega(this.state);
  }

  // Filtros: o analista mexe à vontade e só o botão "Atualizar relatório" leva as escolhas para o relatório.

    const rotQuads = (ids) => {
      if (!ids.length) return '';
      const anos = [];
      ids.forEach((id) => { let g = anos[anos.length - 1]; if (!g || g.a !== qAno(id)) { g = { a: qAno(id), q: [] }; anos.push(g); } g.q.push(qNum(id) + 'º'); });
      if (anos.length === 1) return juntar(anos[0].q) + (ids.length > 1 ? ' quadrimestres de ' : ' quadrimestre de ') + anos[0].a;
      return 'quadrimestres ' + juntar(ids.map((id) => qNum(id) + 'º/' + qAno(id)));
    };
    // Comparação: o período anterior de mesmo tamanho (cada mês ou quadrimestre recua o tamanho da seleção).
    const tempoDe = (ehQ, ms, qs) => {
      if (ehQ ? !qs.length : !ms.length) return { blocos: [], periodo: [], mesesAnt: [], compOk: false, compTxt: '', perTxt: '', perCurto: '' };
      let blocos, mesesAnt, compTxt, perTxt, perCurto;
      if (ehQ) {
        blocos = qs.map((id) => {
          const todos = mesesDoQ(id), feitos = todos.filter((a) => REAL.temMes(a)), aberto = feitos.length < 4;
          return { id, todos, meses: feitos, aberto, rot: qNum(id) + 'º/' + String(qAno(id)).slice(2),
            longo: qNum(id) + 'º quadrimestre de ' + qAno(id) + (aberto ? ' (até agora: ' + rotJanela(feitos) + ')' : ' (' + rotJanela(todos) + ')') };
        });
        const span = qIdx(qs[qs.length - 1]) - qIdx(qs[0]) + 1;
        const qAnt = qs.map((id) => qDe(qIdx(id) - span));
        mesesAnt = [].concat(...qAnt.map(mesesDoQ));
        compTxt = rotQuads(qAnt);
        const ab = blocos.find((b) => b.aberto);
        perTxt = rotQuads(qs) + (ab ? (qs.length > 1 ? ' (o ' + qNum(ab.id) + 'º de ' + qAno(ab.id) + ' até ' + rotMes(ab.meses[ab.meses.length - 1]) + ')' : ' (até agora: ' + rotJanela(ab.meses) + ')') : '');
        perCurto = qs.length === 1 ? rotQuads(qs) : juntar(blocos.map((b) => b.rot)) + ' (quadrimestres)';
      } else {
        const mesmoAno = Math.floor(ms[0] / 12) === Math.floor(ms[ms.length - 1] / 12);
        blocos = ms.map((a) => ({ id: String(a), todos: [a], meses: [a], aberto: false, rot: mesmoAno ? ML[a % 12] : rotMes(a), longo: rotMesLongo(a) }));
        const span = ms[ms.length - 1] - ms[0] + 1;
        mesesAnt = ms.map((a) => a - span);
        compTxt = rotMeses(mesesAnt);
        perTxt = ms.length === 1 ? rotMesLongo(ms[0]) : rotMeses(ms) + ' (' + ms.length + ' meses)';
        perCurto = rotMeses(ms);
      }
      const periodo = [].concat(...blocos.map((b) => b.meses)).sort((x, y) => x - y);
      return { blocos, periodo, mesesAnt, compOk: mesesAnt.length > 0 && mesesAnt[0] >= INICIO, compTxt, perTxt, perCurto };
    };
    const ehQuad = st.intervalo === 'quad';
    let tp = tempoDe(ehQuad, normMeses(st.meses), normQuads(st.quads));
    if (!tp.periodo.length) tp = tempoDe(ehQuad, [ATUAL], [REAL.quadAtual]);
    const { blocos, periodo, mesesAnt, compOk, compTxt, perTxt, perCurto } = tp;
    const temComp = !!st.comparar && compOk;

    // ===== VISUALIZAÇÃO: município, unidades (uma ou mais) ou equipes (uma ou mais).
    const locaisDe = (vs, us, es) => {
      if (vs === 'unidades') return nomesUn.filter((u) => (us || []).indexOf(u) >= 0).map((u) => ({ id: u, u, e: '', nome: u, tipo: null, sub: '' }));
      if (vs === 'equipes') return todasEquipes.filter((x) => (es || []).indexOf(x.id) >= 0).map((x) => ({ id: x.id, u: x.u, e: x.nome, nome: x.nome, tipo: x.tipo, sub: x.tipo + ' · ' + x.u }));
      return [];
    };
    const MUN = { id: '', u: '', e: '', nome: 'Município', tipo: null, sub: '' };
    let visao = ['unidades', 'equipes'].indexOf(st.visao) >= 0 ? st.visao : 'municipio';
    let locais = locaisDe(visao, st.unidades, st.equipes);
    if (!locais.length) { visao = 'municipio'; locais = [MUN]; }
    const varios = locais.length > 1;
    const quemPl = visao === 'unidades' ? 'unidades' : 'equipes';
    const localNome = visao === 'municipio' ? 'Município' : varios ? locais.length + ' ' + quemPl : locais[0].nome;
    const aplica0 = (nn, l) => !l.u ? true : !l.e ? (nn.niveis.indexOf('unidade') >= 0 && unidadeTem(l.u, nn)) : (nn.niveis.indexOf('equipe') >= 0 && nn.tipos.indexOf(l.tipo) >= 0);
    const aplica = (nn, l) => aplica0(nn, l) && REAL.tem(nn, l);
    const locaisDa = (nn) => locais.filter((l) => aplica(nn, l));
    const motivoFora = (nn) => {
      if (visao === 'municipio' || locaisDa(nn).length) return null;
      if (visao === 'unidades') return nn.niveis.indexOf('unidade') < 0 ? 'medidas por equipe: escolha “Equipes”' : (varios ? 'nenhuma das unidades tem equipe ' : 'a unidade não tem equipe ') + nn.tipos.join(' ou ');
      return nn.niveis.indexOf('equipe') < 0 ? 'medidas só no município' : 'só para equipes ' + nn.tipos.join(' ou ');
    };
    // Vários lugares juntos: cada um pesa pelo número de pessoas (no sistema real, soma de numeradores e denominadores).
    const vL = (cod, l, ms) => REAL.valor(N[cod], [l], ms);
    const vG = (cod, ls, ms) => REAL.valor(N[cod], ls, ms);

    // Faixa, ordenação e régua.
    const faixaDe = (n, v) => {
      if (!n.f) return { k: 'neutro', rot: 'Sem faixa oficial' };
      const s = n.f.find((s, k) => n.ge ? v >= s[0] && (v < s[1] || (k === n.f.length - 1 && v <= s[1])) : (k === 0 ? v >= s[0] : v > s[0]) && v <= s[1]) || n.f[n.f.length - 1];
      return { k: s[2], rot: s[3] || nomeF[s[2]] };
    };
    const centroOtimo = (n) => { const s = (n.f || []).find((s) => s[2] === 'otimo'); return s ? (s[0] + s[1]) / 2 : (n.min + n.max) / 2; };
    const score = (n, v) => n.d !== 0 ? v * n.d : peso[faixaDe(n, v).k] * 1000 - Math.abs(v - centroOtimo(n));
    const mudanca = (n, v, a) => a === null || a === undefined ? 0 : (score(n, v) - score(n, a)) / esc(n);
    const unidMedida = (nn) => nn.un === '%' ? ' p.p.' : nn.max <= 10 ? '' : ' pts';
    const dominio = (n, vals) => {
      const amp = n.max - n.min;
      const passo = amp <= 2.5 ? 0.1 : amp <= 10 ? 0.5 : amp <= 50 ? 2 : 5;
      let lo = Math.floor((Math.min.apply(null, vals) - passo) / passo) * passo;
      let hi = Math.ceil((Math.max.apply(null, vals) + passo) / passo) * passo;
      lo = Math.max(n.min, lo); hi = Math.min(n.max, hi);
      if (hi - lo < passo * 4) { lo = Math.max(n.min, lo - passo * 2); hi = Math.min(n.max, hi + passo * 2); }
      return [+lo.toFixed(2), +hi.toFixed(2), passo < 1 ? 1 : 0];
    };
    const segmentos = (n, lo, hi) => {
      if (!n || !n.f) return [{ largura: '100%', cor: tinta.neutro }];
      return n.f.map((s) => ({ a: Math.max(lo, s[0]), b: Math.min(hi, s[1]), k: s[2] })).filter((s) => s.b > s.a)
        .map((s) => ({ largura: ((s.b - s.a) / (hi - lo) * 100).toFixed(2) + '%', cor: tinta[s.k] }));
    };
    const eixoDe = (n, lo, hi, casas) => {
      const un = n.un === '%' ? '%' : '';
      const marcas = [{ pos: '0%', desloc: '0', txt: num(lo, casas) + un }];
      if (n.f) n.f.forEach((s, k) => {
        if (k > 0 && s[0] > lo && s[0] < hi) marcas.push({ pos: ((s[0] - lo) / (hi - lo) * 100).toFixed(2) + '%', desloc: '-50%', txt: num(s[0], s[0] % 1 ? 2 : 0) + ' · ' + (s[3] || nomeF[s[2]]) });
      });
      marcas.push({ pos: '100%', desloc: '-100%', txt: num(hi, casas) + un });
      return marcas;
    };

    const rel = ['geral', 'apoio', 'pontos', 'meses'].indexOf(st.rel) >= 0 ? st.rel : 'geral';

    // Colunas de acompanhamento: os meses (ou quadrimestres) escolhidos lado a lado.
    // Com um quadrimestre só, as colunas são os 4 meses dele e aparece o caminho até o fechamento.
    let colunas = [], modo = '';
    if (ehQuad && blocos.length === 1) {
      modo = 'quadMeses';
      colunas = blocos[0].todos.map((a) => ({ txt: ML[a % 12], meses: [a], futuro: !REAL.temMes(a), parcial: false, longo: rotMesLongo(a) }));
    } else if (blocos.length > 1) {
      modo = ehQuad ? 'quads' : 'meses';
      colunas = blocos.slice(-12).map((b) => ({ txt: b.rot, meses: b.meses, futuro: false, parcial: b.aberto, longo: b.longo }));
    }
    const temMesesCols = (rel === 'geral' || rel === 'apoio') && colunas.length > 0;
    const temCaminho = temMesesCols && modo === 'quadMeses';
    const bQ = modo === 'quadMeses' ? blocos[0] : null;
    const faltam = bQ ? bQ.todos.filter((a) => a > ATUAL) : [];
    const quadAberto = temCaminho && faltam.length > 0;
    const acompanhar = (cod, ls) => {
      if (!temMesesCols || !ls.length) return null;
      const nn = N[cod];
      const vals = colunas.map((c) => (c.futuro ? null : vG(cod, ls, c.meses)));
      const mesesCel = vals.map((v, i) => v === null
        ? { mes: colunas[i].txt, txt: '—', fundo: 'transparent', borda: '1px dashed ' + T.tControle, cor: T.tSuave, rotulo: colunas[i].longo + ': ainda não fechou' }
        : { mes: colunas[i].txt, txt: num(v, nn.fmt), fundo: tinta[faixaDe(nn, v).k], borda: colunas[i].parcial ? '1.5px dashed ' + T.tRefLinha : '1px solid transparent', cor: T.tTexto,
            rotulo: colunas[i].longo + ': ' + num(v, nn.fmt) + nn.un + ' (' + faixaDe(nn, v).rot + ')' });
      if (!temCaminho) return { mesesCel, proj: null, k: '', caminho: '', caminhoSub: '', caminhoFundo: 'transparent' };
      const feitos = vals.filter((v) => v !== null);
      const soma = feitos.reduce((t, v) => t + v, 0), ult = feitos[feitos.length - 1];
      const proj = nn.apura === 'foto' ? ult : corta(nn, (soma + faltam.length * ult) / colunas.length);
      const fp = faixaDe(nn, proj);
      let sub = quadAberto ? 'no ritmo de ' + rotMes(ATUAL) : '';
      if (quadAberto && nn.f && nn.d === 1 && nn.apura !== 'foto') {
        const prox = nn.f.slice().sort((x, y) => x[0] - y[0]).find((f) => f[0] > proj + 1e-9);
        if (prox) {
          const precisa = (colunas.length * prox[0] - soma) / faltam.length, nomeProx = prox[3] || nomeF[prox[2]];
          sub = precisa > nn.max ? nomeProx + ' fora de alcance neste quadrimestre'
            : 'para ' + nomeProx + ': ' + (faltam.length === 1 ? num(precisa, nn.fmt) + nn.un + ' em ' + rotMes(faltam[0]) : 'média de ' + num(precisa, nn.fmt) + nn.un + ' em ' + rotJanela(faltam));
        }
      }
      return {
        mesesCel, proj, k: fp.k, caminhoSub: sub, caminhoFundo: tinta[fp.k],
        caminho: nn.f ? (quadAberto ? 'Fecha em ' : 'Fechou em ') + fp.rot : (quadAberto ? 'Previsto: ' : 'Fechou em ') + num(proj, nn.fmt) + nn.un
      };
    };

    const alternarInfo = (k) => () => this.setState({ info: this.state.info === k ? '' : k });
    const linha = (o) => {
      const lo = o.lo, hi = o.hi;
      const pct = (x) => Math.max(0, Math.min(1, (x - lo) / (hi - lo))) * 100;
      const temA = o.a !== null && o.a !== undefined;
      const p = pct(o.v), pa = temA ? pct(o.a) : p;
      const dif = temA ? o.v - o.a : 0;
      let melhora = 0;
      if (temA && dif !== 0) {
        if (o.n && o.n.d === 0) { const s = score(o.n, o.v) - score(o.n, o.a); melhora = s > 0 ? 1 : s < 0 ? -1 : 0; }
        else melhora = dif * (o.n ? o.n.d : 1) > 0 ? 1 : -1;
      }
      const tipo = o.tipo || 'item';
      const tam = tipo === 'ref' ? 12 : tipo === 'filho' ? 12 : 18;
      const tw = tipo === 'filho' ? 11 : 14, th = Math.round(tw * 0.75);
      const mk = T.marca[tipo];
      const fmt = o.fmt === undefined ? (o.n ? o.n.fmt : 1) : o.fmt;
      const temRef = o.ref !== null && o.ref !== undefined;
      const ac = o.acomp || null, temProj = !!ac && ac.proj !== null && ac.proj !== undefined;
      return {
        cab: false, normal: true,
        posicao: o.posicao || '', nome: o.nome, sub: (o.sub || '') + (o.exemplo ? (o.sub ? ' · ' : '') + 'números de exemplo' : ''),
        abrivel: !!o.alternar, fixo: !o.alternar, alternar: o.alternar || (() => {}), expandido: o.expandido ? 'true' : 'false', seta: o.expandido ? '▾' : '▸',
        rotuloAbrir: o.rotuloAbrir || (o.nome + (o.expandido ? ': fechar equipes' : ': ver equipes')),
        temInfo: !!o.info, abrirInfo: o.info ? alternarInfo(o.info) : (() => {}), infoExp: o.info && st.info === o.info ? 'true' : 'false',
        mostraInfo: !!o.info && st.info === o.info, infoTxt: o.infoTxt || '',
        fonte: tipo === 'filho' ? '14px' : T.tTam, pesoNome: tipo === 'ref' || o.destaque ? T.tPesoForte : T.tPeso, corNome: tipo === 'filho' ? T.tSuave : T.tTexto,
        recuo: tipo === 'filho' ? '22px' : '0', pad: tipo === 'filho' ? '6px 20px' : '10px 20px',
        borda: tipo === 'filho' ? '1px dashed ' + T.tDivisa : '1px solid ' + T.tDivisa,
        fundo: tipo === 'ref' ? T.tRefFundo : (tipo === 'filho' || o.realce) ? T.tRealce : 'transparent',
        segmentos: o.segmentos,
        refPos: temRef ? pct(o.ref).toFixed(2) + '%' : '0%', refOp: !temRef || tipo === 'ref' ? 0 : 0.85,
        caudaEsq: Math.min(p, pa).toFixed(2) + '%', caudaLarg: Math.abs(p - pa).toFixed(2) + '%',
        caudaCor: melhora > 0 ? T.tMelhorou : melhora < 0 ? T.tPiorou : T.tSemMudanca,
        posX: p.toFixed(2) + '%', mTam: tam + 'px', mMargem: (-tam / 2) + 'px', mTopo: (17 - tam / 2) + 'px', mLosango: tipo === 'ref' ? 'block' : 'none', mTri: tipo === 'ref' ? 'none' : 'block',
        tTopo: (17 - T.trilha / 2 - th + 1) + 'px', tTopoProj: (17 + T.trilha / 2 - 1) + 'px', tLarg: tw + 'px', tAlt: th + 'px', tMargem: (-tw / 2) + 'px', tCor: tipo === 'filho' ? mk[1] : mk[0],
        mRaio: tipo === 'ref' ? '2px' : '50%', mGiro: tipo === 'ref' ? '45deg' : '0deg',
        mFundo: mk[0], mBorda: mk[1], mAnel: mk[2], mBordaLarg: tipo === 'filho' ? '2.5px' : '3px',
        valor: o.valorTxt || num(o.v, fmt) + (o.un || ''), vFonte: tipo === 'filho' ? '16px' : '18px',
        delta: o.deltaTxt !== undefined ? o.deltaTxt : (!temA ? '—' : dif === 0 ? '=' : (dif > 0 ? '▲ ' : '▼ ') + num(Math.abs(dif), fmt)),
        deltaCor: o.deltaCor || (melhora > 0 ? T.tSobe : melhora < 0 ? T.tDesce : T.tSuave),
        descricao: o.nome + ': ' + (o.valorTxt || num(o.v, fmt) + (o.un || '')) + (temA ? '; em ' + compTxt + ', ' + num(o.a, fmt) + (o.un || '') : '')
          + (temProj && quadAberto ? '; no ritmo atual, fecha em ' + num(ac.proj, fmt) + (o.un || '') : ''),
        subValor: ac && temA ? (dif === 0 ? '=' : (dif > 0 ? '▲ ' : '▼ ') + num(Math.abs(dif), fmt)) : '',
        mesesCel: ac ? ac.mesesCel : [], caminho: ac ? ac.caminho : '', caminhoSub: ac ? ac.caminhoSub : '',
        caminhoFundo: ac ? ac.caminhoFundo : 'transparent',
        projPos: temProj ? pct(ac.proj).toFixed(2) + '%' : '0%', projOp: temProj && quadAberto ? 1 : 0, projCor: mk[2]
      };
    };

    // Notas na tela e por que alguma não aparece no recorte.
    const visiveis = lista.map((n) => n.cod).filter((c) => !st.ocultas[c]);
    const resumirCodigos = (cods, baseCods) => GRUPOS.map((g) => {
      const doGrupo = cods.filter((c) => N[c].g === g.id);
      if (!doGrupo.length) return '';
      return doGrupo.length === baseCods.filter((c) => N[c].g === g.id).length && doGrupo.length >= 2 ? g.sigla : doGrupo.join(', ');
    }).filter((x) => x).join(', ');
    const descLocal = visao === 'municipio' ? 'o município' : varios ? 'as ' + locais.length + ' ' + quemPl + ' escolhidas' : visao === 'unidades' ? 'a ' + locais[0].nome : 'a equipe ' + locais[0].nome;

    let linhas = [], resumo = [], eixo = [], tituloLista = '', comoLer = '', pergunta = '', descricao = '', foraTxt = '', infoListaTxt = '';
    let rotuloNome = 'Nota', rotuloValor = 'Resultado', rotuloDelta = temComp ? 'vs ' + compTxt : '';
    let legendaPonto = 'resultado do período', legendaRef = '', legendaTraco = '', gruposNota = [], cod = '';
    let temAbrirTodas = false, rotuloAbrirTodas = '', rotuloAbrirTodasCurto = '', alternarTodas = () => {};

    if (rel === 'geral') {
      const porMotivo = {};
      visiveis.forEach((c) => { const m = motivoFora(N[c]); if (m) (porMotivo[m] = porMotivo[m] || []).push(c); });
      foraTxt = Object.keys(porMotivo).length ? 'Não aparecem aqui: ' + Object.keys(porMotivo).map((m) => resumirCodigos(porMotivo[m], visiveis) + ' (' + m + ')').join('; ') + '.' : '';
      const itens = visiveis.filter((c) => !motivoFora(N[c])).map((c) => {
        const nn = N[c], ls = visao === 'municipio' ? [MUN] : locaisDa(nn), v = vG(c, ls, periodo);
        // No município as notas são por equipe: o valor é o agregado (soma de numeradores e denominadores) e a classificação é de cada equipe.
        const eq = visao === 'municipio' && nn.f && nn.niveis.indexOf('equipe') >= 0
          ? todasEquipes.filter((t) => aplica(nn, { u: t.u, e: t.nome, tipo: t.tipo })).map((t) => ({ id: t.id, u: t.u, e: t.nome, nome: t.nome, tipo: t.tipo, sub: t.tipo + ' · ' + t.u }))
              .map((l) => ({ ...l, vv: vL(c, l, periodo) })).sort((x, y) => peso[faixaDe(nn, x.vv).k] - peso[faixaDe(nn, y.vv).k] || x.nome.localeCompare(y.nome, 'pt'))
          : [];
        const grupo = eq.length > 1 ? eq : ls;
        const ks = eq.length > 1 ? eq.map((l) => faixaDe(nn, l.vv).k) : [];
        const bonsEq = ks.filter((k) => k === 'bom' || k === 'otimo').length, regEq = ks.filter((k) => k === 'regular').length;
        const fx = eq.length > 1 ? { k: bonsEq * 2 >= ks.length ? 'bom' : regEq * 2 > ks.length ? 'regular' : 'suficiente', rot: '' } : faixaDe(nn, v);
        return { c, nn, ls, eq, grupo, v, a: temComp ? vG(c, ls, mesesAnt) : null, fx, ac: acompanhar(c, ls) };
      });
      const multis = itens.filter((x) => x.grupo.length > 1).map((x) => x.c);
      const abertas = st.abertas || {};
      const algumaAberta = multis.some((c) => abertas[c]);
      const variosGrupos = GRUPOS.filter((g) => itens.some((x) => x.nn.g === g.id)).length > 1;
      GRUPOS.forEach((g) => {
        const doGrupo = itens.filter((x) => x.nn.g === g.id);
        if (!doGrupo.length) return;
        if (variosGrupos) linhas.push({ cab: true, normal: false, nome: g.titulo, sub: g.sigla + ' · ' + g.quem + ' · ' + pubGrupo(g) });
        doGrupo.forEach((x) => {
          const multi = x.grupo.length > 1, aberta = multi && !!abertas[x.c], porEq = x.eq.length > 1;
          const seg = segmentos(x.nn, x.nn.min, x.nn.max);
          let sub = x.fx.rot + (quadAberto ? ' até agora' : '');
          if (multi) {
            const fxs = x.grupo.map((l) => faixaDe(x.nn, vL(x.c, l, periodo)).k);
            const cont = ['otimo', 'bom', 'suficiente', 'regular'].map((k) => [k, fxs.filter((f) => f === k).length]).filter((p) => p[1]).map((p) => p[1] + ' em ' + nomeF[p[0]]).join(', ');
            sub = porEq ? 'Valor agregado · ' + x.eq.length + ' equipes (' + cont + ')'
              : (x.nn.f ? sub + ' com as ' + x.ls.length + ' juntas' : 'as ' + x.ls.length + ' juntas') + (cont ? ' · ' + cont : '');
          } else if (varios) sub += ' · só ' + x.ls[0].nome;

(async () => {
  const aviso = (t) => { document.getElementById('tela').innerHTML = '<p id="aviso">' + t + ' <a href="/">Voltar ao início</a></p>'; };
  try {
    const r = await fetch('/api/v1/competencias', { credentials: 'same-origin' });
    if (r.status === 401) { location.replace('/entrar'); return; }
    if (!r.ok) throw 0;
    const cs = ((await r.json()).competencias || []);
    const porComp = {};
    await Promise.all(cs.map(async (c) => { const d = await fetch('/api/v1/dados?partes=indicadores&competencia=' + c.competencia, { credentials: 'same-origin' }); if (d.ok) { const ls = (await d.json()).indicadores || []; if (ls.length) porComp[c.competencia] = ls; } }));
    if (!Object.keys(porComp).length) { aviso('Ainda não há indicadores coletados. Rode a coleta pela extensão no computador que acessa o PEC.'); return; }
    try { const e = await fetch('/api/v1/auth/eu', { credentials: 'same-origin' }); if (e.ok) USUARIO = (await e.json()).usuario || null; } catch (_) {}
    const ult = cs.map((c) => c.ultimaColetaEm).filter(Boolean).sort().pop();
    // Equipes homologadas (as que o Ministério avalia): o filtro vem de ?homolog=homologadas|nao e recorta os dados antes de montar o relatório.
    await HOMOLOGACAO.carregar();
    const modoH = ['homologadas', 'nao'].indexOf(new URLSearchParams(location.search).get('homolog')) >= 0 ? new URLSearchParams(location.search).get('homolog') : 'todas';
    const filtroH = document.createElement('div');
    filtroH.id = 'filtro-homolog';
    filtroH.setAttribute('role', 'group');
    filtroH.setAttribute('aria-label', 'Equipes');
    filtroH.style.cssText = 'background:#172B52;color:#fff;padding:8px 28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 14px system-ui,sans-serif';
    filtroH.innerHTML = '<span>Equipes:</span>' + ['todas', 'homologadas', 'nao'].map((m) => '<button type="button" data-m="' + m + '" aria-pressed="' + (m === modoH) + '" style="font:inherit;padding:6px 12px;border-radius:99px;border:1.5px solid currentColor;background:' + (m === modoH ? 'rgba(127,127,127,.25)' : 'transparent') + ';color:inherit;cursor:pointer">' + HOMOLOGACAO.ROTULO[m] + '</button>').join('') + (modoH === 'todas' ? '' : '<span style="font-weight:400">Filtrando pela marcação da página Composição.</span>');
    filtroH.addEventListener('click', (ev) => { const b = ev.target.closest('button[data-m]'); if (!b) return; const u = new URL(location.href); if (b.dataset.m === 'todas') u.searchParams.delete('homolog'); else u.searchParams.set('homolog', b.dataset.m); location.href = u.toString(); });
    // Coleta retroativa: o PEC informa só a última data de cada ação e as listas são as de hoje; por isso, em mês coletado muito depois de acabar, os indicadores de situação (C2 a C7, CVAT, CR2 a CR4) são estimativa e tendem a sair abaixo do Siaps.
    const MESES_ROT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    const retro = cs.filter((c) => { const [a, m] = c.competencia.split('-').map(Number); const fim = Date.UTC(a, m, 1); return c.ultimaColetaEm && Date.parse(c.ultimaColetaEm) - fim > 12 * 86400000; }).map((c) => MESES_ROT[Number(c.competencia.slice(5)) - 1] + '/' + c.competencia.slice(2, 4));
    if (retro.length) { const av = document.createElement('div'); av.id = 'aviso-retro'; av.style.cssText = 'flex-basis:100%;font-weight:400;font-size:13px;opacity:.95'; av.textContent = 'Coleta retroativa em ' + retro.join(', ') + ': C2 a C7, CVAT e CR2 a CR4 desses meses são estimativa e tendem a ficar abaixo do Siaps (o PEC só informa a última data de cada ação). Coletar perto do dia 10 do mês seguinte evita isso.'; filtroH.appendChild(av); }

    const dadosH = HOMOLOGACAO.filtrar(porComp, modoH);
    if (!Object.values(dadosH).some((ls) => ls.length)) { aviso('Nenhuma equipe nesse grupo. Confira a marcação em Composição → Homologação. <a href="/notas">Ver todas as equipes</a>.'); return; }
