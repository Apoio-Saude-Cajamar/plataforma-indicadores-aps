<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F3C72" />
    <title>Sem conexão · Painel APS</title>
    <link rel="icon" href="/img/painelaps.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f5;
        color: #14212b;
        font: 16px/1.5 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
      }
      main {
        max-width: 420px;
        margin: 24px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font: 800 22px Montserrat, system-ui, sans-serif;
        color: #1f3c72;
        margin: 12px 0 6px;
      }
      button {
        margin-top: 16px;
        font: 700 15px Montserrat, system-ui, sans-serif;
        color: #ffffff;
        background: #1f3c72;
        border: 0;
        border-radius: 99px;
        padding: 12px 22px;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/img/painelaps.svg" alt="" />
      <h1>Sem conexão</h1>
      <p>O Painel APS precisa de internet para mostrar os indicadores. Confira o sinal ou o Wi-Fi e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
