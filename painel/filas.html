<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filas e faltas · Painel APS</title>
    <link rel="icon" href="/img/painelaps.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" />
    <style>
      body {
        margin: 0;
      }
      a {
        color: #0e5e8c;
      }
      a:hover {
        color: #08405f;
      }
      button:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid #2f8fd8;
        outline-offset: 2px;
      }
      #aviso {
        font:
          16px/1.5 'Source Sans 3',
          'Segoe UI',
          system-ui,
          sans-serif;
        max-width: 640px;
        margin: 48px auto;
        padding: 0 24px;
        color: #14212b;
      }
    </style>
      <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F3C72" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Painel APS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/mobile.css" />
    <script src="/js/publico/mobile.js" defer></script>
</head>
  <body>
    <div id="tela"><p id="aviso">Carregando filas e faltas…</p></div>
    <template id="modelo">
      <div
        style="
          min-height: 100vh;
          background: #f4f6f5;
          color: #14212b;
          font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.5;
        "
      >
        <div
          style="background: #1f3c72; border-bottom: 4px solid #00a7e7; color: #ffffff; font-family: 'Montserrat', system-ui, sans-serif"
        >
          <div
            style="
              max-width: 1280px;
              margin: 0 auto;
              padding: 14px 24px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 16px;
              flex-wrap: wrap;
            "
          >
            <a
              href="/"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                font-weight: 800;
                font-size: 19px;
                color: #ffffff;
                text-decoration: none;
              "
              ><img src="/img/painelaps.svg" alt="" width="34" height="34" /><span>Painel APS</span></a
            >
            <nav
              aria-label="Áreas do Painel"
              style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-weight: 600; font-size: 14px"
            >
              <template data-sc="for" list="{{menuSite}}" as="ms"
                ><a
                  href="{{ms.href}}"
                  style="
                    color: #ffffff;
                    text-decoration: none;
                    padding: 8px 12px;
                    min-height: 36px;
                    display: inline-flex;
                    align-items: center;
                    border-radius: 99px;
                  "
                  >{{ms.txt}}</a
                ></template
              >
              <template data-sc="if" value="{{temLanc}}"
                ><details style="position: relative">
                  <summary
                    style="
                      color: #ffffff;
                      padding: 8px 12px;
                      min-height: 36px;
                      display: inline-flex;
                      align-items: center;
                      border-radius: 99px;
                      cursor: pointer;
                      list-style: none;
                    "
                  >
                    Lançamentos ▾
                  </summary>
                  <div
                    style="
                      position: absolute;
                      z-index: 20;
                      top: 100%;
                      left: 0;
                      min-width: 230px;
                      margin-top: 6px;
                      background: #ffffff;
                      border: 2px solid #d5dce8;
                      border-radius: 12px;
                      padding: 6px;
                      box-shadow: 0 8px 24px rgba(20, 33, 43, 0.18);
                      display: flex;
                      flex-direction: column;
                    "
                  >
                    <a
                      href="/lancamentos"
                      style="color: #1b2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap"
                      >Metas do PAS</a
                    >
                    <a
                      href="/lancamentos-vacinas"
                      style="color: #1b2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap"
                      >Coberturas vacinais</a
                    >
                    <a
                      href="/estadual#t-form"
                      style="color: #1b2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap"
                      >Cofinanciamento estadual</a
                    >
                  </div>
                </details></template
              >
            </nav>
            <template data-sc="if" value="{{temUsuario}}"
              ><details style="position: relative; font-size: 13px; font-weight: 600">
                <summary
                  style="
                    list-style: none;
                    cursor: pointer;
                    display: inline-flex;
                    align-items: center;
                    gap: 8px;
                    border: 1px solid rgba(255, 255, 255, 0.6);
                    border-radius: 99px;
                    padding: 4px 12px 4px 4px;
                    min-height: 36px;
                  "
                >
                  <span
                    style="
                      width: 26px;
                      height: 26px;
                      border-radius: 50%;
                      background: #00a7e7;
                      display: inline-grid;
                      place-items: center;
                      font-weight: 800;
                    "
                    >{{usuarioInicial}}</span
                  >{{usuarioNome}} ▾
                </summary>
                <div
                  style="
                    position: absolute;
                    z-index: 30;
                    right: 0;
                    top: 100%;
                    margin-top: 6px;
                    min-width: 260px;
                    background: #ffffff;
                    color: #1b2340;
                    border: 2px solid #d5dce8;
                    border-radius: 12px;
                    padding: 6px;
                    box-shadow: 0 8px 24px rgba(20, 33, 43, 0.18);
                    display: flex;
                    flex-direction: column;
                    font-size: 14px;
                  "
                >
                  <template data-sc="for" list="{{itensUsuario}}" as="iu"
                    ><a
                      href="{{iu.href}}"
                      style="color: #1B2340; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: {{iu.peso}}"
                      >{{iu.txt}}</a
                    ></template
                  >
                  <button
                    type="button"
                    onClick="{{sair}}"
                    style="
                      font: inherit;
                      color: #1b2340;
                      background: none;
                      border: 0;
                      border-top: 1px solid #e3e8f0;
                      margin-top: 6px;
                      text-align: left;
                      padding: 10px 12px 8px;
                      cursor: pointer;
                    "
                  >
                    Sair
                  </button>
                </div>
              </details></template
            >
          </div>
        </div>
        <header style="background: #1f3c72; border-bottom: 1px solid #00a7e7; color: #ffffff">
          <div style="max-width: 1280px; margin: 0 auto; padding: 12px 24px 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
              <div style="display: flex; align-items: center; gap: 12px">
                <div style="display: flex; flex-direction: column; line-height: 1.2">
                  <span style="font-weight: 700; font-size: 17px">Filas e faltas</span>
                  <span style="font-size: 13px; color: rgba(255, 255, 255, 0.85)">Médicos e enfermeiros da Atenção Primária · Cajamar</span>
                </div>
              </div>
              <span style="font-size: 13px; color: rgba(255, 255, 255, 0.85)">{{periodoTxt}}</span>
            </div>
            <nav aria-label="Visão" style="display: flex; flex-wrap: wrap; gap: 0 4px">
              <template data-sc="for" list="{{abas}}" as="ab">
                <button
                  type="button"
                  onClick="{{ab.escolher}}"
                  aria-pressed="{{ab.pressionado}}"
                  style="font: inherit; background: none; border: 0; border-bottom: 3px solid {{ab.borda}}; color: {{ab.cor}}; font-weight: {{ab.peso}}; padding: 10px 14px; min-height: 44px; cursor: pointer"
                >
                  {{ab.titulo}}
                </button>
              </template>
            </nav>
          </div>
        </header>

        <div style="background: #ffffff; border-bottom: 1px solid #dce2e0">
          <div
            role="search"
            aria-label="Filtros"
            style="max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end"
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="f-co" style="font-size: 13px; font-weight: 600; color: #33414c">Mês</label>
              <select
                id="f-co"
                value="{{compSel}}"
                onChange="{{escolherComp}}"
                style="
                  font: inherit;
                  padding: 9px 12px;
                  min-height: 44px;
                  border: 1px solid #b9c4c9;
                  border-radius: 8px;
                  background: #ffffff;
                "
              >
                <template data-sc="for" list="{{opcoesComp}}" as="c"><option value="{{c.id}}">{{c.rotulo}}</option></template>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="f-un" style="font-size: 13px; font-weight: 600; color: #33414c">Unidade</label>
              <select
                id="f-un"
                value="{{unidadeSel}}"
                onChange="{{escolherUnidade}}"
                style="
                  font: inherit;
                  padding: 9px 12px;
                  min-height: 44px;
                  border: 1px solid #b9c4c9;
                  border-radius: 8px;
                  background: #ffffff;
                  max-width: 260px;
                "
              >
                <option value="">Todas as unidades</option>
                <template data-sc="for" list="{{opcoesUnidade}}" as="u"><option value="{{u.nome}}">{{u.nome}}</option></template>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="f-eq" style="font-size: 13px; font-weight: 600; color: #33414c">Equipe</label>
              <select
                id="f-eq"
                value="{{equipeSel}}"
                onChange="{{escolherEquipe}}"
                style="
                  font: inherit;
                  padding: 9px 12px;
                  min-height: 44px;
                  border: 1px solid #b9c4c9;
                  border-radius: 8px;
                  background: #ffffff;
                  max-width: 240px;
                "
              >
                <option value="">Todas as equipes</option>
                <template data-sc="for" list="{{opcoesEquipe}}" as="e"><option value="{{e.nome}}">{{e.nome}}</option></template>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; font-weight: 600; color: #33414c">Categoria</span>
              <div
                role="group"
                aria-label="Categoria"
                style="display: flex; border: 1px solid #b9c4c9; border-radius: 8px; overflow: hidden"
              >
                <template data-sc="for" list="{{botoesCat}}" as="b">
                  <button
                    type="button"
                    aria-pressed="{{b.pressionado}}"
                    onClick="{{b.escolher}}"
                    style="font: inherit; min-height: 44px; padding: 0 14px; border: 0; cursor: pointer; background: {{b.fundo}}; color: {{b.cor}}; font-weight: {{b.peso}}"
                  >
                    {{b.rotulo}}
                  </button>
                </template>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="f-pr" style="font-size: 13px; font-weight: 600; color: #33414c">Profissional</label>
              <select
                id="f-pr"
                value="{{profSel}}"
                onChange="{{escolherProf}}"
                style="
                  font: inherit;
                  padding: 9px 12px;
                  min-height: 44px;
                  border: 1px solid #b9c4c9;
                  border-radius: 8px;
                  background: #ffffff;
                  max-width: 260px;
                "
              >
                <option value="">Todos</option>
                <template data-sc="for" list="{{opcoesProf}}" as="p"><option value="{{p.id}}">{{p.nome}}</option></template>
              </select>
            </div>
          </div>
        </div>

        <main style="max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 22px">
          <div style="display: flex; flex-direction: column; gap: 4px; max-width: 840px">
            <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.15; color: #1f3c72">{{titulo}}</h1>
            <p style="margin: 0; color: #566370">
              Quanto as pessoas faltam e quanto esperam por uma vaga. Absenteísmo = faltas ÷ (atendimentos + faltas). Próxima vaga = dias
              corridos até o primeiro dia com horário livre na agenda do PEC.
            </p>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 16px">
            <template data-sc="for" list="{{resumo}}" as="r">
              <div
                style="
                  flex: 1 1 220px;
                  background: #ffffff;
                  border: 1px solid #dce2e0;
                  border-radius: 12px;
                  padding: 16px 20px;
                  display: flex;
                  flex-direction: column;
                  gap: 2px;
                "
              >
                <span style="font-size: 13px; font-weight: 600; color: #566370">{{r.rotulo}}</span>
                <span style="font-size: 30px; font-weight: 700; line-height: 1.15; color: {{r.cor}}">{{r.grande}}</span>
                <span style="font-size: 14px; color: #566370">{{r.texto}}</span>
              </div>
            </template>
          </div>

          <template data-sc="if" value="{{abaLista}}">
            <section
              aria-labelledby="t-lin"
              style="
                background: #ffffff;
                border: 1px solid #dce2e0;
                border-radius: 12px;
                padding: 18px 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
              "
            >
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <h2 id="t-lin" style="margin: 0; font-size: 20px; font-weight: 700">Unidades, equipes e profissionais</h2>
                  <span style="font-size: 14px; color: #566370"
                    >Clique numa unidade para ver as equipes, e numa equipe para ver os profissionais.</span
                  >
                </div>
                <div
                  role="group"
                  aria-label="Ordenar por"
                  style="display: flex; border: 1px solid #b9c4c9; border-radius: 8px; overflow: hidden"
                >
                  <template data-sc="for" list="{{botoesOrdem}}" as="b">
                    <button
                      type="button"
                      aria-pressed="{{b.pressionado}}"
                      onClick="{{b.escolher}}"
                      style="font: inherit; min-height: 44px; padding: 0 14px; border: 0; cursor: pointer; background: {{b.fundo}}; color: {{b.cor}}; font-weight: {{b.peso}}"
                    >
                      {{b.rotulo}}
                    </button>
                  </template>
                </div>
              </div>
              <div style="overflow-x: auto">
                <div style="min-width: 880px; display: flex; flex-direction: column">
                  <div
                    style="
                      display: grid;
                      grid-template-columns: minmax(0, 290px) minmax(0, 1fr) 120px minmax(0, 1fr) 100px;
                      gap: 16px;
                      align-items: end;
                      padding: 6px 8px;
                      font-size: 13px;
                      font-weight: 600;
                      color: #33414c;
                      border-bottom: 1px solid #dce2e0;
                    "
                  >
                    <span>Unidade · equipe · profissional</span>
                    <div style="display: flex; justify-content: space-between">
                      <span>Absenteísmo · 0%</span><span>meta {{metaTxt}}</span><span>50%</span>
                    </div>
                    <span style="text-align: right">Faltas ÷ agendados</span>
                    <div style="display: flex; justify-content: space-between">
                      <span>Próxima vaga · hoje</span><span>15 dias</span><span>30</span><span>60 ou mais</span>
                    </div>
                    <span style="text-align: right">Espera</span>
                  </div>
                  <template data-sc="for" list="{{linhas}}" as="l">
                    <div
                      style="display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr) 120px minmax(0, 1fr) 100px; gap: 16px; align-items: center; padding: {{l.pad}}; border-bottom: 1px solid #EEF1F0; background: {{l.fundo}}"
                    >
                      <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3; padding-left: {{l.recuo}}">
                        <template data-sc="if" value="{{l.abrivel}}">
                          <button
                            type="button"
                            onClick="{{l.alternar}}"
                            aria-expanded="{{l.expandido}}"
                            style="font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: {{l.peso}}; min-height: 28px"
                          >
                            <span aria-hidden="true" style="display: inline-block; width: 18px; color: #566370">{{l.seta}}</span>{{l.nome}}
                          </button>
                        </template>
                        <template data-sc="if" value="{{l.folha}}">
                          <span style="font-weight: 600; overflow-wrap: anywhere">{{l.nome}}</span>
                        </template>
                        <span style="font-size: 13px; color: #566370; padding-left: {{l.recuoSub}}">{{l.sub}}</span>
                      </div>
                      <div role="img" aria-label="{{l.descFaltas}}" style="position: relative; height: 22px">
                        <div
                          style="
                            position: absolute;
                            left: 0;
                            right: 0;
                            top: 7px;
                            height: 8px;
                            border-radius: 4px;
                            overflow: hidden;
                            display: flex;
                          "
                        >
                          <div style="width: {{metaPos}}; background: #D3EBDD"></div>
                          <div style="flex: 1; background: #f6d5d1"></div>
                        </div>
                        <div
                          style="position: absolute; left: 0; top: 7px; height: 8px; border-radius: 4px; width: {{l.faltasPos}}; background: {{l.faltasCor}}"
                        ></div>
                        <div style="position: absolute; top: 1px; height: 20px; width: 2px; left: {{metaPos}}; background: #14212B"></div>
                      </div>
                      <div style="text-align: right; line-height: 1.25">
                        <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{l.faltasTxt}}</span><br />
                        <span style="font-size: 13px; color: #566370; font-variant-numeric: tabular-nums">{{l.conta}}</span>
                      </div>
                      <div role="img" aria-label="{{l.descEspera}}" style="position: relative; height: 22px">
                        <div
                          style="
                            position: absolute;
                            left: 0;
                            right: 0;
                            top: 7px;
                            height: 8px;
                            border-radius: 4px;
                            overflow: hidden;
                            display: flex;
                          "
                        >
                          <div style="width: 25%; background: #d3ebdd"></div>
                          <div style="width: 25%; background: #f8ebc6"></div>
                          <div style="flex: 1; background: #f6d5d1"></div>
                        </div>
                        <span
                          style="position: absolute; top: 2px; left: {{l.esperaPos}}; margin-left: -9px; width: 18px; height: 18px; border-radius: {{l.esperaRaio}}; background: {{l.esperaCor}}; box-shadow: 0 0 0 2px #FFFFFF; opacity: {{l.esperaOp}}"
                        ></span>
                      </div>
                      <div style="text-align: right; line-height: 1.25">
                        <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{l.esperaTxt}}</span><br />
                        <span style="font-size: 13px; color: #566370">{{l.esperaSub}}</span>
                      </div>
                    </div>
                  </template>
                  <template data-sc="if" value="{{semLinhas}}">
                    <p style="margin: 14px 8px; color: #566370">Nenhum profissional neste recorte. Troque os filtros.</p>
                  </template>
                </div>
              </div>
              <p style="margin: 0; font-size: 13px; color: #566370">
                Traço preto: meta de absenteísmo. Na unidade e na equipe, o absenteísmo soma faltas e agendados de todos, e a espera é a
                mediana dos profissionais com agenda lida. Faixas de espera: até 15 dias, de 16 a 30 e acima de 30.
              </p>
            </section>
          </template>

          <template data-sc="if" value="{{abaMapa}}">
            <section
              aria-labelledby="t-quad"
              style="
                background: #ffffff;
                border: 1px solid #dce2e0;
                border-radius: 12px;
                padding: 18px 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              "
            >
              <div style="display: flex; flex-direction: column; gap: 2px">
                <h2 id="t-quad" style="margin: 0; font-size: 20px; font-weight: 700">Onde agir primeiro</h2>
                <span style="font-size: 14px; color: #566370"
                  >Cada ponto numerado é um profissional; a lista ao lado diz quem é cada número. Clique num ponto ou num nome para
                  destacar.</span
                >
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                <div style="flex: 3 1 520px; min-width: 0; display: flex; gap: 10px">
                  <div style="flex: none; width: 22px; display: flex; align-items: center; justify-content: center">
                    <span
                      style="
                        writing-mode: vertical-rl;
                        transform: rotate(180deg);
                        font-size: 13px;
                        font-weight: 600;
                        color: #33414c;
                        white-space: nowrap;
                      "
                      >Dias até a próxima vaga (0 a 60 ou mais)</span
                    >
                  </div>
                  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                    <div
                      style="
                        position: relative;
                        height: 460px;
                        border-left: 1px solid #b9c4c9;
                        border-bottom: 1px solid #b9c4c9;
                        background: #ffffff;
                      "
                    >
                      <div style="position: absolute; left: {{metaPos}}; top: 0; height: 50%; right: 0; background: #FBF1EF"></div>
                      <div
                        style="position: absolute; left: {{metaPos}}; top: 0; bottom: 0; width: 0; border-left: 2px dashed #14212B"
                      ></div>
                      <div style="position: absolute; top: 50%; left: 0; right: 0; height: 0; border-top: 2px dashed #8a979f"></div>
                      <span
                        style="position: absolute; left: 8px; top: 6px; font-size: 13px; font-weight: 600; color: #6e4d00; max-width: 40%"
                        >Fila longa, poucas faltas: falta agenda</span
                      >
                      <span
                        style="
                          position: absolute;
                          right: 8px;
                          top: 6px;
                          font-size: 13px;
                          font-weight: 700;
                          color: #8e2318;
                          text-align: right;
                          max-width: 44%;
                        "
                        >Fila longa e muitas faltas: confirmar consultas e encaixar</span
                      >
                      <span
                        style="
                          position: absolute;
                          left: 8px;
                          bottom: 6px;
                          font-size: 13px;
                          font-weight: 600;
                          color: #1d5a3a;
                          max-width: 40%;
                        "
                        >Vaga rápida e poucas faltas</span
                      >
                      <span
                        style="
                          position: absolute;
                          right: 8px;
                          bottom: 6px;
