                        >menos de {{horMinimo}} agendamentos: pouco para concluir</span
                      >
                    </div>
                  </div>
                  <div style="flex: 1 1 280px; min-width: 0; border: 1px solid #dce2e0; border-radius: 8px; overflow: hidden">
                    <div style="padding: 10px 14px; background: #e7eef3; font-weight: 700">Horários com mais faltas</div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 14px">
                      <thead>
                        <tr style="text-align: left; color: #566370">
                          <th style="padding: 6px 14px; font-weight: 600">Dia e hora</th>
                          <th style="padding: 6px 8px; font-weight: 600; text-align: right">Faltas</th>
                          <th style="padding: 6px 14px; font-weight: 600; text-align: right">Taxa</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template data-sc="for" list="{{topo}}" as="t">
                          <tr style="border-top: 1px solid #eef1f0">
                            <td style="padding: 7px 14px">{{t.quando}}</td>
                            <td style="padding: 7px 8px; text-align: right; font-variant-numeric: tabular-nums">
                              {{t.faltas}} de {{t.base}}
                            </td>
                            <td style="padding: 7px 14px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums">
                              {{t.taxa}}
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </section>
          </template>

          <section
            style="background: #ffffff; border: 1px solid #dce2e0; border-radius: 12px; padding: 16px 20px; font-size: 14px; color: #33414c"
          >
            <b>Fontes.</b> Absenteísmo: relatórios de atendimentos e de absenteísmo do PEC e-SUS APS, coletados pela extensão. Próxima vaga:
            agenda de cada profissional com agenda ativa no PEC, na data da coleta. Faltas por horário: agendamentos do mês de cada
            profissional (reservas de horário ficam de fora), somados por dia da semana e hora. Entram só médicos e enfermeiros das unidades
            de Atenção Primária. O Painel guarda totais por profissional; nada de paciente. Esta tela é restrita a administradores e
            gestores.
          </section>
        </main>
      </div>
    </template>
    <script src="/js/dc-mini.js"></script>
    <script src="/js/rodape.js"></script>
    <script>
      let FILAS = null,
        USUARIO = null,
        ACESSO = {};
      const ITENS_USUARIO = () => {
        if (!USUARIO) return [];
        const ls = [['/perfil', 'Meu perfil']];
        if (USUARIO.origem === 'senha') ls.push(['/trocar-senha', 'Trocar senha']);
        ls.push(['/ajuda', 'Ajuda e como ler os indicadores']);
        if (USUARIO.perfil === 'admin')
          ls.push(
            ['', 'Configurações'],
            ['/usuarios', 'Usuários'],
            ['/monitoramento', 'Monitoramento das coletas'],
            ['/comunicados', 'Comunicados'],
            ['/publicacao', 'Página pública'],
            ['/chaves', 'Chaves da extensão'],
            ['/extensao', 'Extensões do Chrome'],
            ['/historico', 'Histórico de acessos'],
            ['/backups', 'Backups'],
          );
        return ls.map(([href, txt]) => ({ href: href || '#', txt, peso: href ? 600 : 800 }));
      };
      const MENU_SITE = () =>
        [
          ['/', 'Acompanhamentos'],
          ['/composicao', 'Composição'],
          ['/coleta', 'Como coletamos'],
        ]
          .concat(
            USUARIO && (USUARIO.perfil === 'admin' || USUARIO.perfil === 'gestor')
              ? [
                  ['/filas', 'Filas e faltas'],
                  ['/pendencias', 'Pendências'],
                ]
              : [],
          )
          .map(([href, txt]) => ({ href, txt }));
      const META = 19.59;
      // Evolução e trajetória: usam todas as competências guardadas (carregadas só quando uma dessas abas é aberta).
      let EVOL = null,
        EVOL_STATUS = 'nao';
      async function carregarEvolucao() {
        if (EVOL_STATUS !== 'nao') return;
        EVOL_STATUS = 'carregando';
        try {
          const r = await fetch('/api/v1/filas/evolucao?meses=24', { credentials: 'same-origin' });
          if (!r.ok) throw 0;
          EVOL = await r.json();
          EVOL_STATUS = 'pronto';
        } catch (e) {
          EVOL_STATUS = 'erro';
        }
        if (tela) tela.setState({});
      }
      // Mesmo profissional em meses diferentes: unidade + nome + código CBO (o texto do CBO pode variar).
      const codigoCbo = (cbo) => (String(cbo || '').match(/(\d{4}[0-9A-Z]{2})\s*$/) || [, String(cbo || '').trim()])[1];
      const chaveHist = (p) => p.unidade + '|' + p.nome + '|' + codigoCbo(p.cbo);

      function calcHistorico(ctx) {
        const { st, set, unidadeSel, equipeSel, profNome, num, diasTxt, mediana, corFaltas, corEspera, mes } = ctx;
        const MAXF = 50,
          MAXD = 60;
        const espera = { carregando: EVOL_STATUS === 'carregando' || EVOL_STATUS === 'nao', vazio: false, pronto: false, vazioTxt: '' };
        if (EVOL_STATUS === 'erro') Object.assign(espera, { carregando: false, vazio: true, vazioTxt: 'Não foi possível carregar os meses anteriores. Recarregue a página.' });
        const base = (EVOL && EVOL.profissionais) || [];
        const comps = (EVOL && EVOL.competencias) || [];
        if (EVOL_STATUS === 'pronto' && comps.length < 2)
          Object.assign(espera, {
            carregando: false,
            vazio: true,
            vazioTxt: 'Ainda há só ' + (comps.length ? 'um mês' : 'nenhum mês') + ' guardado. A comparação aparece a partir da segunda coleta mensal.',
          });
        const ok = EVOL_STATUS === 'pronto' && comps.length >= 2;

        // Mesmos filtros das outras abas (unidade, equipe, categoria, profissional).
        const filtra = (p) =>
          (!unidadeSel || p.unidade === unidadeSel) &&
          (!equipeSel || (p.equipe || 'Sem equipe') === equipeSel) &&
          (!st.cat || p.categoria === st.cat) &&
          (!profNome || p.nome === profNome);
        const linhasF = base.filter(filtra).map((p) => {
          const f = p.faltas || 0,
            a = p.atendimentos || 0;
          return {
            comp: p.competencia,
            un: p.unidade,
            eq: p.equipe || 'Sem equipe',
            nome: p.nome,
            cat: p.categoria,
            cbo: String(p.cbo || '').replace(/\s*-\s*\S+$/, ''),
            chave: chaveHist(p),
            faltas: f,
            atend: a,
            pct: f + a ? (f / (f + a)) * 100 : null,
            dias: p.agendaLidaEm ? (p.semVaga ? 91 : p.diasVaga) : null,
          };
        });
        const agrega = (ps) => {
          const f = ps.reduce((t, p) => t + p.faltas, 0),
            a = ps.reduce((t, p) => t + p.atend, 0);
          return { pct: f + a ? (f / (f + a)) * 100 : null, dias: mediana(ps.filter((p) => p.dias !== null).map((p) => p.dias)), f, base: f + a };
        };
        const mesCurto = (c) => {
          const [a, m] = c.split('-');
          return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][m - 1] + '/' + a.slice(2);
        };

        const graficosDe = (porMes, quem) => {
          const X = (i) => 48 + 20 + (i * (540 - 40)) / Math.max(1, comps.length - 1);
          const grafico = (porMes, titulo, legenda, cor, valorDe, maxFixo, txtDe, meta) => {
            const vals = porMes.map(valorDe);
            const bruto = Math.max(maxFixo, ...vals.filter((v) => v !== null).map((v) => v * 1.15));
            const passos = 4,
              ordem = Math.pow(10, Math.floor(Math.log10(bruto / passos))),
              passo = [1, 2, 2.5, 5, 10].map((m) => m * ordem).find((x) => x * passos >= bruto),
              vmax = passo * passos;
            const Y = (v) => 200 - (v / vmax) * 180;
            const grades = Array.from({ length: passos + 1 }, (_, i) => {
              const v = passo * i;
              return { y: Y(v).toFixed(1), yTxt: (Y(v) + 4).toFixed(1), txt: num(v, 0) };
            });
            const pts = porMes
              .map((m, i) => ({ m, i, v: vals[i] }))
              .filter((o) => o.v !== null)
              .map((o) => ({
                x: X(o.i).toFixed(1),
                y: Y(o.v).toFixed(1),
                yTxt: (Y(o.v) - 10).toFixed(1),
                txt: txtDe(o.v),
                cor,
                titulo: mes(o.m.comp) + ': ' + txtDe(o.v) + (o.m.base ? ' (' + o.m.f + ' faltas em ' + o.m.base + ' agendados)' : ''),
              }));
            return {
              titulo,
              legenda,
              cor,
              aria: titulo + ': ' + pts.map((p) => p.titulo).join('; '),
              grades,
              pontos: pts,
              linha: pts.map((p) => p.x + ',' + p.y).join(' '),
              eixoX: comps.map((c, i) => ({ x: X(i).toFixed(1), txt: mesCurto(c) })),
              temMeta: meta !== null,
              metaY: meta !== null ? Y(meta).toFixed(1) : 0,
              metaYTxt: meta !== null ? (Y(meta) - 6).toFixed(1) : 0,
              metaTxt: meta !== null ? 'meta ' + num(meta, 2) + '%' : '',
            };
          };
          return [
            grafico(porMes, 'Absenteísmo', 'faltas ÷ (faltas + atendimentos) ' + quem + ', em cada mês', '#C0392B', (m) => m.pct, 25, (v) => num(v, 1) + '%', META),
            grafico(porMes, 'Espera até a próxima vaga', (quem === 'do recorte' ? 'mediana dos profissionais com agenda lida no mês' : 'dias até a próxima vaga na leitura do mês') + ', em dias', '#0E5E8C', (m) => m.dias, 30, (v) => diasTxt(Math.round(v)), null),
          ];
        };
        // ---------- Evolução ----------
        let evo = Object.assign({}, espera);
        if (ok) {
          const porMes = comps.map((c) => Object.assign({ comp: c }, agrega(linhasF.filter((p) => p.comp === c))));
          const graficos = graficosDe(porMes, 'do recorte');
          // Tabela: o nível abaixo do filtro (município → unidades → equipes → profissionais).
          const nivel = profNome || equipeSel ? 'prof' : unidadeSel ? 'eq' : 'un';
          const rot = { un: 'Unidade', eq: 'Equipe', prof: 'Profissional' }[nivel];
          const chaveG = (p) => (nivel === 'un' ? p.un : nivel === 'eq' ? p.eq : p.chave);
          const grupos = {};
          linhasF.forEach((p) => {
            const k = chaveG(p);
            (grupos[k] = grupos[k] || { nome: nivel === 'prof' ? p.nome : k, sub: nivel === 'prof' ? p.cbo + ' · ' + p.eq : nivel === 'eq' ? p.un : '', ps: [] }).ps.push(p);
          });
          const celulas = [];
          const cab = (l1, alinha) => celulas.push({ papel: 'columnheader', l1, l2: '', titulo: '', fundo: '#F6F9FA', alinha, peso: 700, cor: '#33414C', cor2: '#566370' });
          cab(rot, 'left');
          comps.forEach((c) => cab(mesCurto(c), 'center'));
          cab('Variação', 'center');
          const ordenados = Object.values(grupos)
            .map((g) => Object.assign(g, { meses: comps.map((c) => agrega(g.ps.filter((p) => p.comp === c))) }))
            .sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
          ordenados.forEach((g) => {
            celulas.push({ papel: 'rowheader', l1: g.nome, l2: g.sub, titulo: g.nome, fundo: '#FFFFFF', alinha: 'left', peso: 600, cor: '#14212B', cor2: '#566370' });
            g.meses.forEach((m, i) =>
              celulas.push({
                papel: 'cell',
                l1: m.pct === null ? '—' : num(m.pct, 1) + '%',
                l2: m.dias === null ? '' : diasTxt(m.dias),
                titulo: g.nome + ', ' + mes(comps[i]) + ': ' + (m.pct === null ? 'sem agendados' : m.f + ' faltas em ' + m.base + ' agendados') + (m.dias === null ? '' : '; vaga em ' + diasTxt(m.dias)),
                fundo: '#FFFFFF',
                alinha: 'center',
                peso: 600,
                cor: corFaltas(m.pct),
                cor2: m.dias === null ? '#566370' : corEspera(m.dias),
              }),
            );
            const comPct = g.meses.filter((m) => m.pct !== null),
              comDias = g.meses.filter((m) => m.dias !== null);
            const dP = comPct.length >= 2 ? comPct[comPct.length - 1].pct - comPct[0].pct : null,
              dD = comDias.length >= 2 ? comDias[comDias.length - 1].dias - comDias[0].dias : null;
            const sinal = (v, casas, suf) => (v > 0 ? '+' : v < 0 ? '−' : '±') + num(Math.abs(v), casas) + suf;
            celulas.push({
              papel: 'cell',
              l1: dP === null ? '—' : sinal(dP, 1, ' p.p.'),
              l2: dD === null ? '' : sinal(dD, 0, ' dias'),
              titulo: 'Diferença entre o primeiro e o último mês com dados (faltas em pontos percentuais; espera em dias). Negativo é melhora.',
              fundo: '#F6F9FA',
              alinha: 'center',
              peso: 700,
              cor: dP === null ? '#566370' : dP > 1 ? '#C0392B' : dP < -1 ? '#2F855A' : '#33414C',
              cor2: dD === null ? '#566370' : dD > 3 ? '#C0392B' : dD < -3 ? '#2F855A' : '#566370',
            });
          });
          evo = {
            carregando: false,
            vazio: !linhasF.length,
            vazioTxt: 'Nenhum dado deste recorte nos meses guardados.',
            pronto: linhasF.length > 0,
            subtitulo: 'De ' + mes(comps[0]) + ' a ' + mes(comps[comps.length - 1]) + ' · mesmos filtros das outras abas.',
            graficos,
            tabelaTitulo: rot + 's do recorte, mês a mês',
            colunas: 'minmax(200px, 1.6fr) repeat(' + comps.length + ', minmax(76px, 1fr)) minmax(96px, 1fr)',
            larguraMin: 200 + comps.length * 76 + 96 + 'px',
            celulas,
          };
        } else evo.subtitulo = 'Absenteísmo e espera até a vaga ao longo dos meses guardados.';

        // ---------- Quem mudou: uma linha por profissional, com minigráficos de todos os meses ----------
        let tra = Object.assign({}, espera);
        if (ok) {
          const porProf = {};
          linhasF.forEach((p) => {
            const g = (porProf[p.chave] = porProf[p.chave] || { k: p.chave, nome: p.nome, cbo: p.cbo, eq: p.eq, un: p.un, cat: p.cat, ps: [] });
            g.ps.push(p);
            if (p.comp >= (g.ultimo || '')) Object.assign(g, { ultimo: p.comp, cbo: p.cbo, eq: p.eq });
          });
          const COR = { piorou: '#C0392B', misto: '#B7791F', melhorou: '#2F855A', estavel: '#566370', novo: '#566370' };
          const TXT = { piorou: '▲ piorou', misto: '◆ misto', melhorou: '▼ melhorou', estavel: '= igual', novo: 'só um mês' };
          const ORDEM = { piorou: 0, misto: 1, estavel: 2, melhorou: 3, novo: 4 };
          const mini = (vals, maxFixo, meta, cor) => {
            const vmax = Math.max(maxFixo, ...vals.filter((v) => v !== null));
            const X = (i) => 4 + (i * 132) / Math.max(1, vals.length - 1),
              Y = (v) => 32 - (Math.min(v, vmax) / vmax) * 28;
            const pts = vals.map((v, i) => (v === null ? null : { x: X(i).toFixed(1), y: Y(v).toFixed(1) })).filter(Boolean);
            const ult = pts[pts.length - 1];
            return {
              linha: pts.map((p) => p.x + ',' + p.y).join(' '),
              pontos: pts,
              ux: ult ? ult.x : -10,
              uy: ult ? ult.y : -10,
              cor,
              temMeta: meta !== null,
              metaY: meta !== null ? Y(meta).toFixed(1) : 0,
            };
          };
          const sinal = (v, casas, suf) => (v > 0 ? '+' : v < 0 ? '−' : '±') + num(Math.abs(v), casas) + suf;
          const linhas = Object.values(porProf).map((g) => {
            const meses = comps.map((c) => agrega(g.ps.filter((p) => p.comp === c)));
            const comP = meses.map((m, i) => ({ i, v: m.pct })).filter((o) => o.v !== null),
              comD = meses.map((m, i) => ({ i, v: m.dias })).filter((o) => o.v !== null);
            // Mudança recente: último mês com dado contra o mês com dado anterior a ele.
            const dF = comP.length >= 2 ? comP[comP.length - 1].v - comP[comP.length - 2].v : null,
              dD = comD.length >= 2 ? Math.min(comD[comD.length - 1].v, 91) - Math.min(comD[comD.length - 2].v, 91) : null;
            const sF = dF === null ? 0 : dF > 2 ? 1 : dF < -2 ? -1 : 0,
              sD = dD === null ? 0 : dD > 3 ? 1 : dD < -3 ? -1 : 0;
            const ver =
              dF === null && dD === null
                ? 'novo'
                : sF > 0 || sD > 0
                  ? sF < 0 || sD < 0
                    ? 'misto'
                    : 'piorou'
                  : sF < 0 || sD < 0
                    ? 'melhorou'
                    : 'estavel';
            const peso = (dF || 0) / MAXF + (dD || 0) / MAXD;
            const ultP = comP.length ? comP[comP.length - 1].v : null,
              ultD = comD.length ? comD[comD.length - 1].v : null;
            return { g, meses, dF, dD, ver, peso, ultP, ultD };
          });
          const ordem = st.mudOrdem || 'piora';
          linhas.sort((a, b) =>
            ordem === 'nome'
              ? a.g.nome.localeCompare(b.g.nome, 'pt')
              : ordem === 'melhora'
                ? ORDEM[b.ver] === ORDEM.novo
                  ? -1
                  : ORDEM[a.ver] === ORDEM.novo
                    ? 1
                    : a.peso - b.peso
                : ORDEM[a.ver] - ORDEM[b.ver] || b.peso - a.peso,
          );
          const selK = linhas.some((l) => l.g.k === st.mudSel) ? st.mudSel : '';
          const sel = linhas.find((l) => l.g.k === selK);
          const conta = (v) => linhas.filter((l) => l.ver === v).length;
          const botaoO = (id) => ({
            pressionado: ordem === id ? 'true' : 'false',
            fundo: ordem === id ? '#14212B' : '#FFFFFF',
            cor: ordem === id ? '#FFFFFF' : '#14212B',
            peso: ordem === id ? 600 : 400,
          });
          tra = {
            carregando: false,
            vazio: !linhas.length,
            vazioTxt: 'Nenhum profissional deste recorte nos meses guardados.',
            pronto: linhas.length > 0,
            subtitulo:
              'Cada linha mostra os meses de ' + mes(comps[0]) + ' a ' + mes(comps[comps.length - 1]) + '. A mudança compara o último mês com o anterior.',
            resumo: [
              { n: conta('piorou'), txt: ' pioraram', cor: COR.piorou },
              { n: conta('misto'), txt: ' melhoraram numa medida e pioraram na outra', cor: COR.misto },
              { n: conta('melhorou'), txt: ' melhoraram', cor: COR.melhorou },
              { n: conta('estavel'), txt: ' praticamente iguais', cor: '#33414C' },
            ],
            botoesOrdem: [
              ['piora', 'Quem mais piorou'],
              ['melhora', 'Quem mais melhorou'],
              ['nome', 'Nome'],
            ].map(([id, rotulo]) => ({ rotulo, ...botaoO(id), escolher: () => set({ mudOrdem: id }) })),
            temSel: !!sel,
            sel: sel
              ? {
                  nome: sel.g.nome,
                  sub: sel.g.cbo + ' · ' + sel.g.eq + ' · ' + sel.g.un,
                  graficos: graficosDe(
                    comps.map((c, i) => Object.assign({ comp: c }, sel.meses[i])),
                    'deste profissional',
                  ),
                  fechar: () => set({ mudSel: '' }),
                }
              : {},
            linhas: linhas.map((l) => {
              const at = l.g.k === selK;
              return {
                nome: l.g.nome,
                sub: l.g.cbo + ' · ' + l.g.eq + ' · ' + l.g.un,
                miniF: mini(l.meses.map((m) => m.pct), 30, META, '#C0392B'),
                miniD: mini(l.meses.map((m) => m.dias), 30, null, '#0E5E8C'),
                ultF: l.ultP === null ? '—' : num(l.ultP, 1) + '%',
                ultFCor: corFaltas(l.ultP),
                ultD: l.ultD === null ? '—' : diasTxt(l.ultD),
                ultDCor: l.ultD === null ? '#8A979F' : corEspera(l.ultD),
                varF: l.dF === null ? '' : sinal(l.dF, 1, ' p.p.'),
                varD: l.dD === null ? '' : sinal(l.dD, 0, ' dias'),
                veredito: TXT[l.ver],
                corV: COR[l.ver],
                fundo: at ? '#E7EEF3' : l.ver === 'piorou' ? '#FDF6F5' : '#FFFFFF',
                ativo: at ? 'true' : 'false',
                abrir: () => set({ mudSel: at ? '' : l.g.k }),
                aria:
                  l.g.nome +
                  ': absenteísmo ' +
                  l.meses.map((m, i) => mesCurto(comps[i]) + ' ' + (m.pct === null ? 'sem dado' : num(m.pct, 1) + '%')).join(', ') +
                  '; espera ' +
                  l.meses.map((m, i) => mesCurto(comps[i]) + ' ' + (m.dias === null ? 'sem dado' : diasTxt(m.dias))).join(', ') +
                  '. ' +
                  TXT[l.ver],
              };
            }),
          };
        }
        return { evo, tra };
      }

      class Filas extends DCLogic {
        constructor(props) {
          super(props);
          this.state = {
            aba: 'lista',
            unidade: '',
            equipe: '',
            cat: '',
            prof: '',
            ordem: 'faltas',
            abertas: {},
            destaque: '',
            medida: 'taxa',
          };
        }
        renderVals() {
          const st = this.state;
          const num = (v, c) => v.toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
          const MAXF = 50,
            MAXD = 60;
          const posF = (v) => (Math.max(0, Math.min(1, (v || 0) / MAXF)) * 100).toFixed(2) + '%';
          const posD = (v) => (Math.max(0, Math.min(1, v / MAXD)) * 100).toFixed(2) + '%';
          const todos = FILAS.profissionais.map((p, i) => {
            const f = p.faltas || 0,
              a = p.atendimentos || 0,
              temAg = !!p.agendaLidaEm;
            return {
              id: String(i),
              un: p.unidade,
              eq: p.equipe || 'Sem equipe',
              cat: p.categoria,
              nome: p.nome,
              cbo: String(p.cbo || '').replace(/\s*-\s*\d+$/, ''),
              faltas: f,
              atend: a,
              pct: f + a ? (f / (f + a)) * 100 : null,
              dias: temAg ? (p.semVaga ? 91 : p.diasVaga) : null,
              semVaga: temAg && !!p.semVaga,
            };
          });
          const unidadeSel = todos.some((p) => p.un === st.unidade) ? st.unidade : '';
          const doUn = todos.filter((p) => !unidadeSel || p.un === unidadeSel);
          const equipes = Array.from(new Set(doUn.map((p) => p.eq))).sort((a, b) => a.localeCompare(b, 'pt'));
          const equipeSel = equipes.indexOf(st.equipe) >= 0 ? st.equipe : '';
          const antesProf = doUn.filter((p) => (!equipeSel || p.eq === equipeSel) && (!st.cat || p.cat === st.cat));
          const profSel = antesProf.some((p) => p.id === st.prof) ? st.prof : '';
          const sel = antesProf.filter((p) => !profSel || p.id === profSel);

          const corFaltas = (v) => (v === null ? '#8A979F' : v <= META ? '#2F855A' : '#C0392B');
          const corEspera = (d) => (d <= 15 ? '#2F855A' : d <= 30 ? '#B7791F' : '#C0392B');
          const soma = (arr, k) => arr.reduce((t, p) => t + p[k], 0);
          const mediana = (arr) => {
            if (!arr.length) return null;
            const o = arr.slice().sort((a, b) => a - b),
              m = Math.floor(o.length / 2);
            return o.length % 2 ? o[m] : Math.round((o[m - 1] + o[m]) / 2);
          };
          const diasTxt = (d) => (d === null ? '—' : d > 90 ? '90+ dias' : d + (d === 1 ? ' dia' : ' dias'));
          const agrega = (ps) => {
            const f = soma(ps, 'faltas'),
              a = soma(ps, 'atend');
            return {
              faltas: f,
              atend: a,
              pct: f + a ? (f / (f + a)) * 100 : null,
              dias: mediana(ps.filter((p) => p.dias !== null).map((p) => p.dias)),
              n: ps.length,
            };
          };
          const ordena = (arr) =>
            arr
              .slice()
              .sort((x, y) =>
                st.ordem === 'espera'
                  ? (y.dias === null ? -1 : y.dias) - (x.dias === null ? -1 : x.dias)
                  : st.ordem === 'nome'
                    ? x.nome.localeCompare(y.nome, 'pt', { numeric: true })
                    : (y.pct === null ? -1 : y.pct) - (x.pct === null ? -1 : x.pct),
              );
          const linhaDe = (o, nivel, extra) =>
            Object.assign(
              {
                nome: o.nome,
                sub: o.sub,
                recuo: nivel * 22 + 'px',
                recuoSub: extra && extra.abrivel ? '18px' : '0',
                pad: nivel === 2 ? '8px' : '10px 8px',
                fundo: nivel === 0 ? '#F6F9FA' : 'transparent',
                peso: nivel === 0 ? 700 : 600,
                abrivel: false,
                folha: true,
                alternar: () => {},
                expandido: 'false',
                seta: '',
                faltasPos: posF(o.pct),
                faltasCor: corFaltas(o.pct),
                faltasTxt: o.pct === null ? '—' : num(o.pct, 1) + '%',
                conta: o.faltas + o.atend ? o.faltas + ' de ' + (o.faltas + o.atend) : 'sem agendados',
                esperaPos: o.dias === null ? '0%' : posD(o.dias),
                esperaCor: o.dias === null ? '#8A979F' : corEspera(o.dias),
                esperaOp: o.dias === null ? 0 : 1,
                esperaRaio: '50%',
                esperaTxt: diasTxt(o.dias),
                esperaSub: o.dias === null ? 'agenda não lida' : extra && extra.grupo ? 'mediana' : '',
                descFaltas:
                  o.nome +
                  ': absenteísmo ' +
                  (o.pct === null ? 'sem dados' : num(o.pct, 1) + '%, ' + o.faltas + ' faltas em ' + (o.faltas + o.atend) + ' agendados') +
                  '; meta ' +
                  num(META, 2) +
                  '%',
                descEspera: o.nome + ': ' + (o.dias === null ? 'agenda não lida' : 'próxima vaga em ' + diasTxt(o.dias)),
              },
              extra || {},
            );

          // Faltas × acesso: por equipe, faltas e espera (desta tela) ao lado da C1 (% de demanda programada), do mesmo mês.
          const gEq = {};
          for (const p of todos.filter((x) => (!unidadeSel || x.un === unidadeSel) && (!st.cat || x.cat === st.cat))) {
            const k = p.un + '|' + p.eq;
            (gEq[k] = gEq[k] || { un: p.un, eq: p.eq, ps: [] }).ps.push(p);
          }
          const linhasAcesso = Object.keys(gEq)
            .map((k) => {
              const g = gEq[k],
                ag = agrega(g.ps),
                c1 = ACESSO[k] || null;
              const c1p = c1 && c1.den ? (c1.num / c1.den) * 100 : null;
              const alta = ag.pct !== null && ag.pct > META,
                longa = ag.dias !== null && ag.dias > 30,
                progBaixa = c1p !== null && c1p < 50;
              const leitura =
                ag.pct === null && c1p === null
                  ? 'Sem dados.'
                  : alta && longa
                    ? 'Fila longa e muitas faltas: confirmar consultas antes de abrir mais agenda.'
                    : longa && !alta
                      ? 'Fila longa com poucas faltas: falta agenda.'
                      : alta
                        ? 'Muitas faltas com vaga rápida: reforçar a confirmação.'
                        : 'Dentro da meta de faltas e com vaga em até 30 dias.';
              return {
                un: g.un,
                eq: g.eq,
                nome: g.eq === 'Sem equipe' ? 'Sem equipe' : g.eq,
                sub: g.un,
                pct: ag.pct,
                dias: ag.dias,
                c1p,
                faltasTxt: ag.pct === null ? '—' : num(ag.pct, 1) + '%',
                faltasCor: corFaltas(ag.pct),
                esperaTxt: diasTxt(ag.dias),
                esperaCor: ag.dias === null ? '#8A979F' : corEspera(ag.dias),
                c1Txt: c1p === null ? '—' : num(c1p, 1) + '%',
                c1Sub: c1 ? c1.num + ' de ' + c1.den : 'sem C1 (equipe sem indicador)',
                leitura: progBaixa
                  ? leitura + ' Pouca demanda programada (C1 abaixo de 50%): a agenda é tomada por demanda espontânea.'
                  : leitura,
              };
            })
            .sort((a, b) => (b.pct === null ? -1 : b.pct) - (a.pct === null ? -1 : a.pct));
          const resumoAcesso = (() => {
            const com = linhasAcesso.filter((l) => l.pct !== null && l.c1p !== null);
            if (com.length < 3) return 'Poucas equipes têm C1 e faltas no mesmo mês para comparar.';
            const mx = (a) => a.reduce((t, v) => t + v, 0) / a.length;
            const xs = com.map((l) => l.c1p),
              ys = com.map((l) => l.pct),
              mxv = mx(xs),
              myv = mx(ys);
            const sxy = xs.reduce((t, x, i) => t + (x - mxv) * (ys[i] - myv), 0),
              sxx = xs.reduce((t, x) => t + (x - mxv) ** 2, 0),
              syy = ys.reduce((t, y) => t + (y - myv) ** 2, 0);
            const r = sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0;
            return (
              com.length +
              ' equipes com C1 e faltas. Correlação entre C1 e faltas: ' +
              num(r, 2) +
              (Math.abs(r) < 0.3 || com.length < 8
                ? ' (indicativa: ' + (com.length < 8 ? 'com menos de 8 equipes' : 'correlação fraca') + ' não dá para afirmar relação)'
                : r < 0
                  ? ' (mais demanda programada, menos faltas)'
                  : ' (mais demanda programada, mais faltas)') +
              '.'
            );
          })();

          // Unidade -> equipe -> profissional, abrindo por clique.
          const linhas = [];
          const abertas = st.abertas || {};
          const alterna = (k) => () => {
            const o = { ...(this.state.abertas || {}) };
            if (o[k]) delete o[k];
            else o[k] = true;
            this.setState({ abertas: o });
          };
          const unidadesSel = Array.from(new Set(sel.map((p) => p.un)));
          const grupos = ordena(
            unidadesSel.map((u) => Object.assign({ nome: u, ps: sel.filter((p) => p.un === u) }, agrega(sel.filter((p) => p.un === u)))),
          );
          grupos.forEach((g) => {
            const ku = 'u|' + g.nome,
              abU = !!abertas[ku] || unidadesSel.length === 1;
            const eqs = Array.from(new Set(g.ps.map((p) => p.eq)));
            linhas.push(
              linhaDe(
                {
                  ...g,
                  sub:
                    eqs.length +
                    (eqs.length === 1 ? ' equipe' : ' equipes') +
                    ' · ' +
                    g.n +
                    (g.n === 1 ? ' profissional' : ' profissionais'),
                },
                0,
                {
                  abrivel: true,
                  folha: false,
                  grupo: true,
                  alternar: alterna(ku),
                  expandido: abU ? 'true' : 'false',
                  seta: abU ? '▾' : '▸',
                },
              ),
            );
            if (!abU) return;
            ordena(
              eqs.map((e) => Object.assign({ nome: e, ps: g.ps.filter((p) => p.eq === e) }, agrega(g.ps.filter((p) => p.eq === e)))),
            ).forEach((e) => {
              const ke = ku + '|' + e.nome,
                abE = !!abertas[ke] || eqs.length === 1 || !!equipeSel || !!profSel;
              linhas.push(
                linhaDe({ ...e, sub: e.n + (e.n === 1 ? ' profissional' : ' profissionais') }, 1, {
                  abrivel: true,
                  folha: false,
                  grupo: true,
                  alternar: alterna(ke),
                  expandido: abE ? 'true' : 'false',
                  seta: abE ? '▾' : '▸',
                }),
              );
              if (abE)
                ordena(e.ps).forEach((p) =>
                  linhas.push(
                    linhaDe({ ...p, sub: p.cbo }, 2, {
                      esperaRaio: p.cat === 'Médico' ? '50%' : '4px',
                      fundo: p.pct !== null && p.pct > META && p.dias !== null && p.dias > 30 ? '#FBF1EF' : 'transparent',
                    }),
                  ),
                );
            });
          });

          const tot = agrega(sel);
          const comAg = sel.filter((p) => p.dias !== null);
          const criticos = sel.filter((p) => p.pct !== null && p.pct > META && p.dias !== null && p.dias > 30);
          const resumo = [
            {
              rotulo: 'Absenteísmo do recorte',
              grande: tot.pct === null ? '—' : num(tot.pct, 1) + '%',
              cor: corFaltas(tot.pct),
              texto: tot.faltas + ' faltas em ' + (tot.faltas + tot.atend) + ' agendados · meta ' + num(META, 2) + '%',
            },
            {
              rotulo: 'Espera típica',
              grande: diasTxt(tot.dias),
              cor: '#14212B',
              texto: comAg.length
                ? 'mediana até a próxima vaga, em ' + comAg.length + ' agendas lidas'
                : 'nenhuma agenda lida neste recorte',
            },
            {
              rotulo: 'Sem vaga em 30 dias',
              grande: comAg.filter((p) => p.dias > 30).length + ' de ' + comAg.length,
              cor: '#14212B',
              texto: 'profissionais com a agenda cheia além de um mês',
            },
            {
              rotulo: 'Fila longa e muita falta',
              grande: String(criticos.length),
              cor: criticos.length ? '#C0392B' : '#2F855A',
              texto: criticos.length ? 'acima da meta de faltas e mais de 30 dias de espera' : 'nenhum profissional nessa situação',
            },
          ];

          // Mapa: só quem tem as duas medidas. Numeração do mais crítico (mais dias e mais faltas) para o menos.
          const noMapa = sel
            .filter((p) => p.pct !== null && p.dias !== null)
            .sort((a, b) => b.dias / MAXD + b.pct / MAXF - (a.dias / MAXD + a.pct / MAXF));
          const destaqueId = noMapa.some((p) => p.id === st.destaque) ? st.destaque : '';
          const corCat = (p) => (p.cat === 'Médico' ? '#0E5E8C' : '#B8641B');
          const valores = (p) => num(p.pct, 1) + '% · ' + diasTxt(p.dias);
          const destacar = (id) => () => this.setState({ destaque: this.state.destaque === id ? '' : id });
          const pontos = noMapa.map((p, i) => {
            const at = p.id === destaqueId;
            return {
              n: i + 1,
              x: posF(p.pct),
              y: ((1 - Math.min(1, p.dias / MAXD)) * 100).toFixed(2) + '%',
              cor: corCat(p),
              raio: p.cat === 'Médico' ? '50%' : '4px',
              tam: at ? '30px' : '24px',
              margem: at ? '-15px 0 0 -15px' : '-12px 0 0 -12px',
              sombra: at ? '0 0 0 3px #14212B' : 'none',
              op: destaqueId && !at ? 0.35 : 1,
              z: at ? 3 : 1,
              ativo: at ? 'true' : 'false',
              destacar: destacar(p.id),
              titulo:
                i + 1 + ' · ' + p.nome + ' (' + p.eq + ', ' + p.un + '): ' + num(p.pct, 1) + '% de faltas, vaga em ' + diasTxt(p.dias),
            };
          });
          const legenda = noMapa.map((p, i) => ({
            n: i + 1,
            nome: p.nome,
            sub: p.eq + ' · ' + p.un,
            valores: valores(p),
            cor: corCat(p),
            raio: p.cat === 'Médico' ? '50%' : '4px',
            fundo: p.id === destaqueId ? '#E7EEF3' : '#FFFFFF',
            ativo: p.id === destaqueId ? 'true' : 'false',
            destacar: destacar(p.id),
          }));
          const d = noMapa.find((p) => p.id === destaqueId);
          const fora = sel.length - noMapa.length;

          // Faltas por horário: soma a grade dia da semana × hora dos profissionais do recorte (os mesmos filtros das outras abas).
          const MINIMO = 5,
            DIAS = ['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
            DIAS_LONGO = ['', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
          const chaveP = (un, eq, nome) => un + '|' + (eq || 'Sem equipe') + '|' + nome;
          const nosel = new Set(sel.map((p) => chaveP(p.un, p.eq, p.nome)));
          const celH = {};
          let profsH = 0;
          (FILAS.horarios || []).forEach((h) => {
            if (!nosel.has(chaveP(h.unidade, h.equipe, h.nome))) return;
            profsH++;
            Object.keys(h.grade || {}).forEach((d) =>
              Object.keys(h.grade[d]).forEach((hr) => {
                const v = h.grade[d][hr],
                  c = (celH[d + '|' + hr] = celH[d + '|' + hr] || { d: +d, h: +hr, ag: 0, at: 0, fa: 0 });
                c.ag += v[0];
                c.at += v[1];
                c.fa += v[2];
              }),
            );
          });
          const cels = Object.values(celH).map((c) =>
            Object.assign(c, { base: c.at + c.fa, taxa: c.at + c.fa ? (c.fa / (c.at + c.fa)) * 100 : null }),
          );
          const horTem = cels.length > 0;
          const horas = horTem
            ? Array.from(
                { length: Math.max(...cels.map((c) => c.h)) - Math.min(...cels.map((c) => c.h)) + 1 },
                (_, i) => Math.min(...cels.map((c) => c.h)) + i,
              )
            : [];
          const dias = horTem ? [1, 2, 3, 4, 5, 6].concat(cels.some((c) => c.d === 7 && c.ag) ? [7] : []) : [];
          const porTaxa = st.medida === 'taxa';
          const valorC = (c) => (porTaxa ? c.taxa : c.fa);
          const usaveis = cels.filter((c) => (porTaxa ? c.base >= MINIMO : c.fa > 0));
          const vmax = Math.max(1, ...usaveis.map(valorC));
          const RAMPA = ['#E3EEF9', '#BCD6EE', '#8FBAE0', '#5F98CF', '#2F6FB3', '#1B4F8C', '#0B2F5B'];
          const faixa = (v) => RAMPA[Math.min(RAMPA.length - 1, Math.floor((v / vmax) * RAMPA.length))];
          const hh = (n) => String(n).padStart(2, '0') + 'h';
          const celulas = [];
          if (horTem) {
            celulas.push({
              txt: '',
              fundo: 'transparent',
              cor: '#566370',
              peso: 600,
              tam: '13px',
              alt: '24px',
              alinha: 'flex-start',
              textura: 'none',
              titulo: '',
            });
            dias.forEach((d) =>
              celulas.push({
                txt: DIAS[d],
                titulo: DIAS_LONGO[d],
                fundo: 'transparent',
                cor: '#33414C',
                peso: 600,
                tam: '13px',
                alt: '24px',
                alinha: 'center',
                textura: 'none',
              }),
            );
            horas.forEach((hr) => {
              celulas.push({
                txt: hh(hr),
                titulo: '',
                fundo: 'transparent',
                cor: '#33414C',
                peso: 600,
                tam: '13px',
                alt: '38px',
                alinha: 'flex-start',
                textura: 'none',
              });
              dias.forEach((d) => {
                const c = celH[d + '|' + hr],
                  quando = DIAS_LONGO[d] + ', ' + hh(hr);
                if (!c || !c.ag) {
                  celulas.push({
                    txt: '',
                    titulo: quando + ': sem agenda',
                    fundo: '#F4F6F5',
                    cor: '#8A979F',
                    peso: 400,
                    tam: '13px',
                    alt: '38px',
                    alinha: 'center',
                    textura: 'none',
                  });
                  return;
                }
                const poucos = c.base < MINIMO,
                  sem = !porTaxa && !c.fa;
                const titulo =
                  quando +
                  ': ' +
                  (c.base ? c.fa + ' faltas em ' + c.base + ' agendamentos (' + num(c.taxa, 1) + '%)' : 'nenhum agendamento já decidido') +
                  ' · ' +
                  profsH +
                  (profsH === 1 ? ' profissional' : ' profissionais') +
                  ' no recorte' +
                  (poucos ? ' · poucos agendamentos para concluir' : '');
                if ((porTaxa && poucos) || sem) {
                  celulas.push({
                    txt: porTaxa ? '·' : '0',
                    titulo,
                    fundo: '#FFFFFF',
                    cor: '#566370',
                    peso: 400,
                    tam: '13px',
                    alt: '38px',
                    alinha: 'center',
                    textura: porTaxa ? 'repeating-linear-gradient(45deg, #D5DCE0 0 2px, transparent 2px 6px)' : 'none',
                  });
                  return;
                }
                const v = valorC(c),
                  f = faixa(v),
                  escuro = RAMPA.indexOf(f) >= 3;
                celulas.push({
                  txt: porTaxa ? num(v, 0) + '%' : String(v),
                  titulo,
                  fundo: f,
                  cor: escuro ? '#FFFFFF' : '#14212B',
                  peso: 600,
                  tam: '13px',
                  alt: '38px',
                  alinha: 'center',
                  textura: 'none',
                });
              });
            });
          }
          const topo = cels
            .filter((c) => c.fa > 0 && c.base >= MINIMO)
            .sort((a, b) => (porTaxa ? b.taxa - a.taxa || b.fa - a.fa : b.fa - a.fa || b.taxa - a.taxa))
            .slice(0, 8)
            .map((c) => ({ quando: DIAS_LONGO[c.d] + ', ' + hh(c.h), faltas: c.fa, base: c.base, taxa: num(c.taxa, 1) + '%' }));
          const totH = cels.reduce((t, c) => ({ fa: t.fa + c.fa, base: t.base + c.base }), { fa: 0, base: 0 });

          const botao = (ativo) => ({
            pressionado: ativo ? 'true' : 'false',
            fundo: ativo ? '#14212B' : '#FFFFFF',
            cor: ativo ? '#FFFFFF' : '#14212B',
            peso: ativo ? 600 : 400,
          });
          const mes = (c) => {
            const [a, m] = c.split('-');
            return (
              ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][
                m - 1
              ] +
              ' de ' +
              a
            );
          };
          const hist =
            st.aba === 'evolucao' || st.aba === 'trajetoria'
              ? calcHistorico({
                  st,
                  set: (o) => this.setState(o),
                  unidadeSel,
                  equipeSel,
                  profNome: profSel ? (todos.find((p) => p.id === profSel) || {}).nome : '',
                  num,
                  diasTxt,
                  mediana,
                  corFaltas,
                  corEspera,
                  mes,
                })
              : { evo: {}, tra: {} };
          const lidas = FILAS.profissionais
            .map((p) => p.agendaLidaEm)
            .filter(Boolean)
            .sort();
          return {
            menuSite: MENU_SITE(),
            temLanc: !!USUARIO && (USUARIO.perfil === 'admin' || USUARIO.perfil === 'gestor'),
            itensUsuario: ITENS_USUARIO(),
            usuarioInicial: USUARIO ? USUARIO.nome.trim().charAt(0).toUpperCase() : '',
            temUsuario: !!USUARIO,
            usuarioNome: USUARIO ? USUARIO.nome.split(' ')[0] : '',
            sair: async () => {
              try {
                await fetch('/api/v1/auth/sair', { method: 'POST', credentials: 'same-origin' });
              } finally {
                location.replace('/entrar');
              }
            },
            linhas,
            resumo,
            pontos,
            legenda,
            semLinhas: linhas.length === 0,
            metaPos: posF(META),
            metaTxt: num(META, 2) + '%',
            abaLista: st.aba === 'lista',
            abaMapa: st.aba === 'mapa',
            abaHorario: st.aba === 'horario',
            abaAcesso: st.aba === 'acesso',
            abaEvolucao: st.aba === 'evolucao',
            abaTrajetoria: st.aba === 'trajetoria',
            evo: hist.evo,
            tra: hist.tra,
            linhasAcesso,
            resumoAcesso,
            horTem,
            horSem: !horTem,
            horCols: dias.length,
            celulas,
            topo,
            horMinimo: MINIMO,
            horSemTxt: (FILAS.horarios || []).length
              ? 'Nenhum profissional deste recorte tem agenda lida no mês.'
              : 'Ainda não há grade de horários. Na extensão (versão 0.9.1 ou mais nova), marque "Faltas por horário" junto de "Filas e faltas" e rode a coleta.',
            horResumo: horTem
              ? totH.fa +
                ' faltas em ' +
                totH.base +
                ' agendamentos já decididos (' +
                (totH.base ? num((totH.fa / totH.base) * 100, 1) : '0') +
                '%), de ' +
                profsH +
                (profsH === 1 ? ' profissional' : ' profissionais') +
                '. Passe o mouse sobre uma célula para ver os números.'
              : 'Agendamentos do mês de cada profissional, somados por dia da semana e hora.',
            legTitulo: porTaxa ? 'Taxa de faltas' : 'Número de faltas',
            legMin: porTaxa ? '0%' : '1',
            legMax: porTaxa ? num(vmax, 0) + '%' : String(Math.round(vmax)),
            botoesMedida: [
              ['taxa', 'Taxa de faltas'],
              ['faltas', 'Número de faltas'],
            ].map(([id, rotulo]) => ({ rotulo, ...botao(st.medida === id), escolher: () => this.setState({ medida: id }) })),
            abas: [
              ['lista', 'Unidades, equipes e profissionais'],
              ['mapa', 'Mapa: onde agir primeiro'],
              ['horario', 'Faltas por horário'],
              ['acesso', 'Faltas × acesso'],
              ['evolucao', 'Evolução mês a mês'],
              ['trajetoria', 'Quem mudou'],
            ].map(([id, titulo]) => ({
              titulo,
              pressionado: st.aba === id ? 'true' : 'false',
              borda: st.aba === id ? '#00A7E7' : 'transparent',
              cor: st.aba === id ? '#FFFFFF' : 'rgba(255,255,255,.85)',
              peso: st.aba === id ? 700 : 400,
              escolher: () => {
                this.setState({ aba: id });
                if (id === 'evolucao' || id === 'trajetoria') carregarEvolucao();
              },
            })),
            temDestaque: !!d,
            destaque: d
              ? {
                  nome: d.nome,
                  sub: d.cbo + ' · ' + d.eq + ' · ' + d.un,
                  valores:
                    num(d.pct, 1) + '% de faltas (' + d.faltas + ' de ' + (d.faltas + d.atend) + ') · próxima vaga em ' + diasTxt(d.dias),
                }
              : {},
            semAgendaTxt: fora
              ? fora + (fora === 1 ? ' profissional fica' : ' profissionais ficam') + ' fora do mapa por não ter as duas medidas.'
              : '',
            periodoTxt:
              'Faltas: ' +
              mes(FILAS.competencia) +
              (lidas.length
                ? ' · Agendas lidas em ' + new Date(lidas[lidas.length - 1]).toLocaleDateString('pt-BR')
                : ' · Agendas ainda não lidas'),
            titulo: profSel
              ? sel[0].nome
              : equipeSel
                ? equipeSel + (unidadeSel ? ' · ' + unidadeSel : '')
                : unidadeSel || 'Onde as pessoas faltam e onde esperam mais?',
            compSel: FILAS.competencia,
            opcoesComp: FILAS.competencias.map((c) => ({ id: c, rotulo: mes(c) })),
            escolherComp: (ev) => carregar(ev.target.value),
            unidadeSel,
            equipeSel,
            profSel,
            opcoesUnidade: Array.from(new Set(todos.map((p) => p.un)))
              .sort((a, b) => a.localeCompare(b, 'pt'))
              .map((nome) => ({ nome })),
            opcoesEquipe: equipes.map((nome) => ({ nome })),
            opcoesProf: antesProf
              .slice()
              .sort((a, b) => a.nome.localeCompare(b.nome, 'pt'))
              .map((p) => ({ id: p.id, nome: p.nome })),
            botoesCat: [
              ['', 'Todos'],
              ['Médico', 'Médicos'],
              ['Enfermeiro', 'Enfermeiros'],
            ].map(([id, rotulo]) => ({ rotulo, ...botao((st.cat || '') === id), escolher: () => this.setState({ cat: id, prof: '' }) })),
            botoesOrdem: [
              ['faltas', 'Mais faltas'],
              ['espera', 'Maior espera'],
              ['nome', 'Nome'],
            ].map(([id, rotulo]) => ({ rotulo, ...botao(st.ordem === id), escolher: () => this.setState({ ordem: id }) })),
            escolherUnidade: (ev) => this.setState({ unidade: ev.target.value, equipe: '', prof: '' }),
            escolherEquipe: (ev) => this.setState({ equipe: ev.target.value, prof: '' }),
            escolherProf: (ev) => this.setState({ prof: ev.target.value }),
          };
        }
      }
      let tela = null;
      async function carregar(comp) {
        const aviso = (t) => {
          document.getElementById('tela').innerHTML = '<p id="aviso">' + t + ' <a href="/">Voltar ao início</a></p>';
          tela = null;
        };
        try {
          const r = await fetch('/api/v1/filas' + (comp ? '?competencia=' + encodeURIComponent(comp) : ''), { credentials: 'same-origin' });
          if (r.status === 401) {
            location.replace('/entrar');
            return;
          }
          if (r.status === 403) {
            aviso('Esta tela mostra dados por profissional e é restrita a administradores e gestores.');
            return;
          }
          if (!r.ok) throw 0;
          const d = await r.json();
          if (!USUARIO) {
            try {
              const e = await fetch('/api/v1/auth/eu', { credentials: 'same-origin' });
              if (e.ok) USUARIO = (await e.json()).usuario || null;
            } catch (_) {}
          }
          if (!d.profissionais.length) {
            aviso(
              'Ainda não há dados de filas e faltas. Na extensão, marque "Filas e faltas" e rode a coleta no computador que acessa o PEC.',
            );
            return;
          }
          FILAS = d;
          ACESSO = {};
          try {
            const a = await fetch('/api/v1/dados?competencia=' + encodeURIComponent(d.competencia), { credentials: 'same-origin' });
            if (a.ok)
              for (const x of (await a.json()).indicadores || [])
                if (x.codigo === 'C1' && x.denominador)
                  ACESSO[x.unidade + '|' + (x.equipe || 'Sem equipe')] = { num: x.numerador, den: x.denominador };
          } catch (_) {}
          if (tela) tela.setState({});
          else tela = montarDC(document.getElementById('modelo'), Filas, document.getElementById('tela'), {});
        } catch (e) {
          aviso('Não foi possível carregar. Recarregue a página.');
        }
      }
      carregar();
    </script>
  </body>
</html>
