<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indicadores APS – Cajamar</title>
  <style>
    :root { --fundo: #f6f7f9; --texto: #1d2330; --suave: #5b6475; --destaque: #0b5ea8; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #14171d; --texto: #e7eaf0; --suave: #a3abba; --destaque: #6fb2f0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 16px; }
    main { max-width: 520px; }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 .5rem; }
    p { color: var(--suave); margin: .25rem 0; }
    #estado { color: var(--destaque); }
  </style>
</head>
<body>
  <main>
    <h1>Plataforma de Indicadores da Atenção Primária</h1>
    <p>Secretaria de Saúde de Cajamar. O painel de indicadores está em construção.</p>
    <p id="estado">Verificando o serviço…</p>
  </main>
  <script>
    fetch('/api/v1/saude').then(r => r.json())
      .then(d => { document.getElementById('estado').textContent = d.ok ? 'Serviço de dados em funcionamento (versão ' + d.versao + ').' : 'Serviço indisponível.'; })
      .catch(() => { document.getElementById('estado').textContent = 'Serviço indisponível no momento.'; });
  </script>
</body>
</html>
