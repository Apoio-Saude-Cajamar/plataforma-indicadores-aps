--tagb:#FBF0D3;--tagt:#6E4D00;--sel:#14212B;--selt:#fff;--mk:#0E5E8C;--ttl:#14212B;
--rg:#F6D5D1;--sf:#F8EBC6;--bm:#DCEBC8;--ot:#BFE0CC;--ne:#E3E8E6;--up:#1D6B45;--dn:#A8322A}

--pg:#0E151C;--cd:#16202A;--bd:#2A3743;--tx:#E6EDF3;--su:#A7B4C0;--ac:#5AA9E0;--lk:#7CC0EE;--rl:#1A2531;--ct:#4B5D6E;
--hd:#16202A;--ht:#E6EDF3;--hs:#A7B4C0;--hb:1px solid #2A3743;--hl:#4B5D6E;--tab:#E6EDF3;--tabl:#5AA9E0;--tabi:#A7B4C0;
--tagb:#3A2F12;--tagt:#F3D27A;--sel:#E6EDF3;--selt:#0E151C;--mk:#7CC0EE;--ttl:#E6EDF3;
--rg:#5E2F35;--sf:#5C4B22;--bm:#2F4D3B;--ot:#2B6B50;--ne:#2E3B48;--up:#7AD39E;--dn:#F29A72}

--pg:#0E151C;--cd:#16202A;--bd:#2A3743;--tx:#E6EDF3;--su:#A7B4C0;--lk:#7CC0EE;--rl:#1A2531;--ct:#4B5D6E;--hd:#16202A;--ht:#E6EDF3;--hs:#A7B4C0;--hb:1px solid #2A3743;
--sel:#E6EDF3;--selt:#0E151C;--mk:#7CC0EE;--ttl:#E6EDF3;--rg:#5E2F35;--sf:#5C4B22;--bm:#2F4D3B;--ot:#2B6B50;--ne:#2E3B48;--up:#7AD39E;--dn:#F29A72}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--pg);color:var(--tx);font-family:var(--ff);font-size:var(--fs);font-weight:var(--fw);line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{background:var(--hd);color:var(--ht);border-bottom:var(--hb)}
.w{max-width:1280px;margin:0 auto;padding:0 20px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;padding-top:12px}
.top b{font-size:17px;font-weight:700}.top small{display:block;color:var(--hs)}
.tag{font-size:12px;font-weight:600;background:var(--tagb);color:var(--tagt);border-radius:99px;padding:3px 10px}
.tm{display:flex;border:1px solid var(--hl);border-radius:8px;overflow:hidden}
.tm button{background:none;border:0;color:var(--ht);padding:0 12px;min-height:32px;font-size:13px;cursor:pointer}
.tm button[aria-pressed=true]{background:var(--ht);color:var(--hd);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:0 26px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--tabi);padding:8px 0 9px;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--tab);border-color:var(--tabl);font-weight:700}
.filt{position:sticky;top:0;z-index:3;background:var(--pg);border-bottom:1px solid var(--bd)}
.filt .w{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;padding-top:10px;padding-bottom:10px}
.g{display:flex;flex-direction:column;gap:4px}
.g>span{font-size:12px;font-weight:700;color:var(--su);text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;border:1px solid var(--ct);border-radius:8px;overflow:hidden;background:var(--cd)}
.seg button{border:0;background:none;padding:0 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--selt);font-weight:700}
.ms{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ms button,.ch button{min-height:36px;min-width:46px;padding:0 10px;border:1px solid var(--ct);border-radius:8px;background:var(--cd);cursor:pointer}
.ms button[aria-pressed=true],.ch button[aria-pressed=true]{background:var(--sel);color:var(--selt);border-color:var(--sel);font-weight:700}
.ms button:disabled{opacity:.35;cursor:default}
.ms .ano{min-width:0;border-style:dashed}
.ch{display:flex;flex-wrap:wrap;gap:4px}
select{min-height:40px;padding:0 10px;border:1px solid var(--ct);border-radius:8px;background:var(--cd);min-width:200px;max-width:340px}
select:disabled{opacity:.5}
.ck{display:flex;gap:8px;align-items:center;min-height:40px;cursor:pointer}
main{padding:22px 0 48px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:28px;line-height:1.2;color:var(--ttl);font-weight:var(--hw)}
p{margin:0;color:var(--su)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px 18px}
.card b{display:block;font-size:26px;line-height:1.2;color:var(--ttl)}
.card span{color:var(--su)}
.card.fx{border-top:6px solid var(--c)}
.fxh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fxh em{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c)}
.card b.lst{font-size:18px;line-height:1.4;margin-top:6px}
.sec{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px 0 6px}
.sec h2{margin:0;font-size:19px;color:var(--ttl)}
.sh{padding:0 20px 10px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between}
.sh .g{margin-left:auto}
.sc{overflow-x:auto}
.gr{display:grid;gap:14px;align-items:center;padding:9px 20px;border-top:1px solid var(--bd)}
.gr.h{border:0;font-size:12px;font-weight:700;color:var(--su);padding-bottom:4px}
.gr.ref{background:var(--rl)}
.nm{min-width:0;line-height:1.3}.nm small{display:block;color:var(--su);font-size:13px}
.tr{position:relative;height:30px}
.tr i{position:absolute;left:0;right:0;top:11px;height:8px;border-radius:99px}
.tr u{position:absolute;top:6px;width:2px;height:18px;margin-left:-1px;background:var(--tx);opacity:.8}
.tr s{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--mk);border:3px solid var(--cd);box-shadow:0 0 0 1.5px var(--mk);box-sizing:border-box}
.v{text-align:right;line-height:1.2}.v b{font-size:17px}.v small{display:block;font-size:12px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}
.mc{display:flex;align-items:center;justify-content:center;min-height:32px;border-radius:6px;font-weight:600;font-size:13px}
.mc.e{border:1px dashed var(--ct);color:var(--su);font-weight:400}
.mc.p{outline:1.5px dashed var(--tx);outline-offset:-1.5px}
.pl{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
.pos{text-align:right;color:var(--su)}
.q1{border-left:2px solid var(--bd)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 20px 10px;border-top:1px solid var(--bd);font-size:13px;color:var(--su)}
.lg em{display:inline-block;width:14px;height:8px;border-radius:4px;margin-right:5px;font-style:normal}
.nt{padding:6px 20px 10px;font-size:13px;color:var(--su)}
.ii{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;padding:0;border-radius:50%;border:1.5px solid var(--su);background:transparent;color:var(--su);font:700 11px/1 inherit;cursor:help;position:relative;vertical-align:middle}
.ii:hover::after,.ii:focus::after{content:attr(data-tip);position:absolute;z-index:20;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:min(320px,80vw);padding:10px 12px;border-radius:8px;background:var(--tx,#1f2933);color:var(--pg,#fff);font:400 13px/1.45 inherit;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:normal}
.barra-usuario{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ht)}
.barra-usuario a,.barra-usuario button{color:inherit;font:inherit;background:none;border:1px solid var(--hl);border-radius:99px;padding:3px 10px;cursor:pointer;text-decoration:none}
.barra-usuario a:hover,.barra-usuario button:hover{border-color:var(--ht)}

<script>
const ATUAL=2026*12+9,INI=2025*12,ML=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],
MG=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],
rm=a=>ML[a%12]+'/'+String(a/12|0).slice(2),rml=a=>MG[a%12]+' de '+(a/12|0),
rng=(a,b)=>{const r=[];for(;a<=b;a++)r.push(a);return r},
rj=ms=>ms.length==1?rm(ms[0]):rm(ms[0])+'–'+rm(ms[ms.length-1]),
jt=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1],
/* Vários meses, contínuos ou não: "set/26–out/26", "jan, mar–abr/26 · nov/25". */
rms=ms=>{if(ms[ms.length-1]-ms[0]+1==ms.length)return rj(ms);const g=[];ms.forEach(a=>{const y=a/12|0;let x=g[g.length-1];if(!x||x.y!=y){x={y,r:[]};g.push(x)}const r=x.r[x.r.length-1];if(r&&r[1]==a-1)r[1]=a;else x.r.push([a,a])});
 return g.map(x=>jt(x.r.map(r=>r[0]==r[1]?ML[r[0]%12]:ML[r[0]%12]+'–'+ML[r[1]%12]))+'/'+String(x.y).slice(2)).join(' · ')},
nf=(v,c)=>v.toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c}),
hs=s=>{let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%9973;return h},
CF={regular:'rg',suficiente:'sf',bom:'bm',otimo:'ot'},NF={regular:'Regular',suficiente:'Suficiente',bom:'Bom',otimo:'Ótimo'},
PS={regular:0,suficiente:1,bom:2,otimo:3,neutro:1.5};
/* Escopo Cajamar: não existem eAPP (prisional) nem eSFR/eABR (ribeirinha) neste catálogo nem nas equipes.
   Nomes conforme as notas metodológicas do MS (eSF/eAP 23/09/2025; eSB e eCR 02/10/2026; eMulti 01/07/2026). */
const F100=[[0,25,'regular'],[25,50,'suficiente'],[50,75,'bom'],[75,100,'otimo']],
GR=[['qualidade','Qualidade do cuidado','C1 a C7'],['vinculo','Vínculo (CVAT)','CVAT'],['bucal','Saúde bucal','B1 a B6'],['emulti','eMulti','M1 e M2'],['ecr','Consultório na Rua','CR1 a CR4']];
const mk=(g,c,nome,mun,ant,o)=>Object.assign({g,c,nome,mun,ant,min:0,max:100,d:1,fmt:1,un:'',f:F100,ni:['municipio','unidade','equipe'],tp:['eSF','eAP'],ap:'m'},o||{});
const L=[
mk('qualidade','C1','Mais acesso',81.1,80.7,{d:0,fmt:0,un:'%',ap:'r',f:[[0,10,'regular'],[10,30,'suficiente'],[30,50,'bom'],[50,70,'otimo'],[70,100,'regular']],sen:'Ótimo entre 50% e 70% de demanda programada; acima de 70% volta a Regular.'}),
mk('qualidade','C2','Cuidado no desenvolvimento infantil',46.3,47,{pr:[['A','1ª consulta até 30 dias de vida',20,.82],['B','9 ou mais consultas até 2 anos',20,.41],['C','9 ou mais registros de peso e altura',20,.38],['D','2 visitas do ACS',20,.36],['E','Vacinas completas',20,.55]]}),
mk('qualidade','C3','Cuidado na gestação e puerpério',58.9,61.2,{pr:[['A','1ª consulta até a 12ª semana',10,.71],['B','7 ou mais consultas',9,.34],['C','7 ou mais aferições de pressão',9,.39],['D','7 ou mais registros de peso e altura',9,.42],['E','3 visitas do ACS',9,.58],['F','dTpa a partir da 20ª semana',9,.63],['G','Testes no 1º trimestre',9,.76],['H','Testes no 3º trimestre',9,.45],['I','Consulta no puerpério',9,.55],['J','Visita do ACS no puerpério',9,.47],['K','Atendimento de saúde bucal',9,.61]]}),
mk('qualidade','C4','Cuidado da pessoa com diabetes',61.6,60.8,{pr:[['A','Consulta nos últimos 6 meses',20,.78],['B','Pressão nos últimos 6 meses',15,.82],['C','Peso e altura em 12 meses',15,.64],['D','2 visitas do ACS em 12 meses',20,.48],['E','Hemoglobina glicada em 12 meses',15,.59],['F','Avaliação dos pés em 12 meses',15,.37]]}),
mk('qualidade','C5','Cuidado da pessoa com hipertensão',65.2,64.5,{pr:[['A','Consulta nos últimos 6 meses',25,.74],['B','Pressão nos últimos 6 meses',25,.8],['C','Peso e altura em 12 meses',25,.62],['D','2 visitas do ACS em 12 meses',25,.45]]}),
mk('qualidade','C6','Cuidado da pessoa idosa',57.4,55.1,{pr:[['A','Consulta em 12 meses',25,.7],['B','Peso e altura em 12 meses',25,.58],['C','2 visitas do ACS em 12 meses',25,.41],['D','Vacina da gripe em 12 meses',25,.61]]}),
mk('qualidade','C7','Cuidado da mulher na prevenção do câncer',39.4,38.2,{mg:'Aproximado. Itens A, B e D seguem a nota. O item C (consulta de saúde sexual e reprodutiva, 30 pontos) conta quem tem um código CIAP/CID da nota e atendimento médico ou de enfermagem em 12 meses, mas o PEC não informa quando o código foi registrado: o item real tende a ser menor, até cerca de 10 pontos percentuais, o que pesa uns 3 pontos na nota.'}),
mk('vinculo','CVAT-C','Vínculo: dimensão cadastro',92.4,91.8,{mg:'Aproximado. O cadastro individual segue a nota (ficha CDS atualizada em 24 meses, sem fora da área). O cadastro do domicílio não é ligado à pessoa no PEC: usa a fração de imóveis atualizados da microárea, e o PEC conta imóvel atualizado em 1 ano (a nota aceita 24 meses). O índice tende a sair um pouco abaixo do real.',un:'%',f:null,ap:'f'}),
mk('vinculo','CVAT-A','Vínculo: dimensão acompanhamento',64,62.5,{mg:'Piso: o valor real é igual ou maior. O PEC informa só a data do último contato de cada tipo (médico, enfermagem, odontologia, visita); quem teve dois contatos do mesmo tipo, atividade coletiva ou vacina não aparece. Bolsa Família/BPC (peso 1,3) virá de fonte externa.',un:'%',f:null,ap:'f'}),
mk('bucal','B1','Primeira consulta programada',.92,.88,{mg:'Aproximado. Conta registros de primeira consulta programática; a nota conta cada pessoa uma vez em 12 meses por dentista. Repetições são raras, a diferença tende a ser pequena.',max:2,fmt:2,un:'%',tp:['eSB'],ap:'r',f:[[0,.25,'regular'],[.25,.75,'suficiente'],[.75,1.25,'bom'],[1.25,2,'otimo']]}),
mk('bucal','B2','Tratamento concluído',48,45.5,{un:'%',tp:['eSB'],ap:'r'}),
mk('bucal','B3','Taxa de exodontia',8.1,8.6,{max:20,d:0,fmt:1,un:'%',tp:['eSB'],ap:'r',f:[[0,3,'regular'],[3,10,'otimo'],[10,12,'bom'],[12,14,'suficiente'],[14,20,'regular']],sen:'Ótimo entre 3% e 10%; muito abaixo ou muito acima perde pontos.'}),
mk('bucal','B4','Escovação supervisionada em faixa etária escolar (6 a 12 anos)',.31,.18,{max:2,fmt:2,un:'%',tp:['eSB'],ap:'r',f:[[0,.25,'regular'],[.25,.5,'suficiente'],[.5,1,'bom'],[1,2,'otimo']]}),
mk('bucal','B5','Procedimentos odontológicos preventivos',71,73,{d:0,fmt:0,un:'%',tp:['eSB'],ap:'r',f:[[0,40,'regular'],[40,55,'suficiente'],[55,65,'bom'],[65,85,'otimo'],[85,100,'regular']],sen:'Ótimo entre 65% e 85%; acima de 85% volta a Regular.'}),
mk('bucal','B6','Tratamento restaurador atraumático',4.2,3.9,{max:12,un:'%',tp:['eSB'],ap:'r',f:[[0,3,'regular'],[3,6,'suficiente'],[6,8,'bom'],[8,12,'otimo']]}),
mk('emulti','M1','Média de atendimentos por pessoa pela eMulti',2.4,2.2,{mg:'Aproximado. Pessoas diferentes vêm da lista de atendimentos do PEC e dos participantes das atividades coletivas; atendimentos lançados só em ficha CDS não mostram a pessoa e entram por estimativa. A faixa vai de todos serem pessoas já contadas (média maior) a todos serem pessoas novas (média menor).',max:4,tp:['eMulti'],ni:['municipio','equipe'],ap:'r',f:[[0,1,'regular'],[1,2,'suficiente'],[2,3,'bom'],[3,4,'otimo']]}),
mk('emulti','M2','Ações interprofissionais realizadas pela eMulti',1.8,1.6,{mg:'Aproximado. Exato para os registros da própria eMulti. Quando o profissional da eMulti é o segundo profissional num atendimento registrado por outra equipe, o registro fica com a outra equipe e não entra aqui.',max:7,tp:['eMulti'],ni:['municipio','equipe'],ap:'r',f:[[0,1,'regular'],[1,2.5,'suficiente'],[2.5,5,'bom'],[5,7,'otimo']]}),
mk('ecr','CR1','Mais acesso à eCR',100,96,{fmt:0,tp:['eCR'],ni:['municipio','equipe'],ap:'r'}),
mk('ecr','CR2','Cuidado na gestação',50,45,{mg:'Aproximado. A boa prática A pede 1 consulta por trimestre; o PEC dá o total e as consultas até 12 semanas, então conta 3 ou mais consultas com ao menos 1 no 1º trimestre.',fmt:0,tp:['eCR'],ni:['municipio','equipe']}),
mk('ecr','CR3','Rastreio de infecções sexualmente transmissíveis',62,58,{fmt:0,tp:['eCR'],ni:['municipio','equipe']}),
mk('ecr','CR4','Cuidado da pessoa com tuberculose',40,40,{mg:'Aproximado. Pessoas com tuberculose e teste de HIV são exatos. Consultas, baciloscopia e raio X vêm de totais do relatório filtrado pelos CIDs de tuberculose, que não diz a quem pertence cada registro: o valor é o teto, com faixa mínima e máxima. Com poucas pessoas, a diferença pode ser grande.',fmt:0,tp:['eCR'],ni:['municipio','equipe']})];

   out='<section class="sec">'+cab(n.c+' · '+n.nome+ii(n),'Quantas pessoas cumpriram cada boa prática e quantos pontos se deixa de ganhar nela.')+'<div class="sc"><div style="min-width:760px"><div class="gr h" style="grid-template-columns:'+cols+'"><span></span><span>Boa prática</span><span></span><span style="text-align:right">Cumpriram</span><span>Perde</span></div>'+it.map((x,i)=>'<div class="gr" style="grid-template-columns:'+cols+'"><span class="pos">'+(i+1)+'º</span><div class="nm">'+x.l+' · '+x.t+'<small>vale '+x.w+' pontos</small></div>'+tr(null,0,100,x.pc*100,null)+'<div class="v"><b>'+nf(x.pc*100,0)+'%</b></div><span class="'+(x.pd>=5?'dn':'')+'">−'+nf(x.pd,1)+' pts</span></div>').join('')+'</div></div></section>'}}
 if(S.rel=='meses'){
  const Y=c.anoM,ms=rng(Y*12,Y*12+11),cols='minmax(230px,1.6fr) repeat(12,minmax(46px,1fr))';
  perg='Como cada nota andou mês a mês em '+Y+'?';desc=esq(S.e?'Equipe '+S.e:S.u||'Município')+'. Cada quadrado é um mês, com a cor da faixa; os quadrimestres estão separados.';
  out=vs.length?'<section class="sec">'+cab('Notas','Meses ainda sem fechamento aparecem vazios. Passe o mouse num quadrado para ver o valor e a faixa.')+'<div class="sc"><div style="min-width:960px"><div class="gr h" style="grid-template-columns:'+cols+';padding-bottom:0"><span></span>'+[1,2,3].map(q=>'<span class="q1" style="grid-column:span 4;padding-left:6px">'+q+'º quadrimestre</span>').join('')+'</div><div class="gr h" style="grid-template-columns:'+cols+'"><span>Nota</span>'+ms.map((a,i)=>'<span style="text-align:center'+(i%4?'':';border-left:2px solid var(--bd)')+'">'+ML[i]+'</span>').join('')+'</div>'+
  GR.map(g=>{const d=vs.filter(n=>n.g==g[0]);if(!d.length)return'';return(S.gr?'':'<div class="gr" style="display:block;padding:12px 20px 2px;border-top:1px solid var(--bd)"><b>'+g[1]+'</b></div>')+d.map(n=>'<div class="gr" style="grid-template-columns:'+cols+';padding-top:5px;padding-bottom:5px"><div class="nm">'+n.c+' · '+n.nome+ii(n)+'</div>'+ms.map((a,i)=>{if(a>ATUAL||a<INI)return'<span class="mc e" title="'+rml(a)+': sem dados">—</span>';const v=vm(n.c,S.u,S.e,a);return'<span class="mc" title="'+rml(a)+': '+nf(v,n.fmt)+n.un+' ('+fx(n,v).r+')" style="background:var(--'+(CF[fx(n,v).k]||'ne')+')">'+nf(v,n.fmt)+'</span>'}).join('')+'</div>').join('')}).join('')+'</div></div>'+legenda('<span>— sem dados</span>')+'</section>':'<section class="sec"><p class="nt">Nenhuma nota neste recorte. Troque a unidade, a equipe ou o grupo.</p></section>'}
 $('#main').innerHTML='<div><h1>'+esq(perg)+'</h1><p>'+desc+'</p></div>'+(cards?'<div class="cards">'+cards+'</div>':'')+out}
/* Vários meses ou quadrimestres: cada clique liga ou desliga; a seleção nunca fica vazia. */
function alterna(lista,v){const i=lista.indexOf(v);if(i<0)lista.push(v);else if(lista.length>1)lista.splice(i,1)}
function set(k,v){
 if(k=='mt'){alterna(S.ms,+v);return render()}
 if(k=='qt'){alterna(S.qs,v);return render()}
 if(k=='ano')v=+v;
 S[k]=v;
 if(k=='u')S.e='';
 if(k=='modo'&&v=='m')S.ano=Math.max(...S.ms)/12|0;
 if(k=='cmp')S.cmp=!!v;
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b&&!b.disabled)set(b.dataset.k,b.dataset.v)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k)set(t.dataset.k,t.type=='checkbox'?t.checked:t.value)});
/* Tema: Personalizado (padrão), Claro e Escuro; a escolha fica guardada neste navegador. */
const TEMAS=[['claro','Claro'],['pers','Personalizado'],['escuro','Escuro']];
let tema='';try{tema=localStorage.getItem('notas-tema')||''}catch(e){}
if(!TEMAS.some(t=>t[0]==tema))tema=matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'pers';
function aplicaTema(){document.documentElement.dataset.theme=tema;$('#tema').innerHTML=TEMAS.map(t=>'<button type="button" data-tema="'+t[0]+'" aria-pressed="'+(tema==t[0])+'">'+t[1]+'</button>').join('')}
$('#tema').addEventListener('click',e=>{const b=e.target.closest('button[data-tema]');if(!b)return;tema=b.dataset.tema;try{localStorage.setItem('notas-tema',tema)}catch(e){}aplicaTema()});
aplicaTema();render();
</script><script src="/js/sessao.js"></script>
