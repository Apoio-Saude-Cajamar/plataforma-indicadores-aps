<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indicadores de Atenção Primária · Cajamar</title>
    <link rel="icon" href="/img/painelaps.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Montserrat, system-ui, sans-serif;
        color: #1b2340;
        background: #f4f7fb;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible,
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #00a7e7;
        outline-offset: 3px;
      }
      header {
        background: #1f3c72;
        border-bottom: 4px solid #00a7e7;
        color: #fff;
      }
      .topo {
        max-width: 1560px;
        margin: 0 auto;
        padding: 14px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .marca {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 19px;
      }
      .barra-usuario {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
      }
      .barra-usuario a,
      .barra-usuario button {
        color: inherit;
        font: inherit;
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 99px;
        padding: 5px 14px;
        cursor: pointer;
      }
      main {
        max-width: 1560px;
        margin: 0 auto;
        padding: 32px 32px 56px;
      }
      .voltar {
        font-weight: 600;
        color: #1f3c72;
        text-decoration: underline;
        font-size: 14px;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 30px;
        font-weight: 800;
        color: #1f3c72;
        line-height: 1.2;
      }
      .intro {
        margin: 0 0 20px;
        font-size: 15px;
        line-height: 1.55;
        color: #4a5670;
        max-width: 760px;
      }
      .sel {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 28px;
        margin-bottom: 20px;
      }
      .sel label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
        color: #4a5670;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .sel select {
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-transform: none;
        letter-spacing: 0;
        min-height: 42px;
        padding: 0 12px;
        border: 2px solid #d5dce8;
        border-radius: 10px;
        background: #fff;
        color: #1b2340;
        min-width: 180px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .card,
      .bloco {
        background: #fff;
        border: 2px solid #d5dce8;
        border-radius: 14px;
        padding: 18px 20px;
      }
      .card small {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #4a5670;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .card .v {
        font-size: 34px;
        font-weight: 800;
        color: #1f3c72;
        line-height: 1.1;
      }
      .card .s {
        font-size: 13px;
        color: #4a5670;
        margin-top: 6px;
        line-height: 1.45;
      }
      .pill {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        border-radius: 99px;
        padding: 3px 10px;
        margin-left: 8px;
        vertical-align: middle;
      }
      .c-o {
        background: #c7ecd9;
        color: #0f5a41;
      }
      .c-b {
        background: #d9ecf8;
        color: #0b4f73;
      }
      .c-s {
        background: #fbf0d3;
        color: #6e4700;
      }
      .c-r {
        background: #f8d9dc;
        color: #8a1b2a;
      }
      .up {
        color: #0f6b4f;
        font-weight: 700;
      }
      .dn {
        color: #a8222f;
        font-weight: 700;
      }
      .bloco {
        margin-bottom: 20px;
      }
      .bloco h2 {
        margin: 0 0 6px;
        font-size: 19px;
        color: #1b2340;
      }
      .bloco p.d {
        margin: 0 0 14px;
        font-size: 14px;
        color: #4a5670;
        line-height: 1.5;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 10px;
        border-bottom: 1px solid #e3e8f0;
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4a5670;
      }
      td.n,
      th.n {
        text-align: right;
        white-space: nowrap;
      }
      .tab {
        overflow-x: auto;
      }
      .barra {
        display: flex;
        height: 16px;
        border-radius: 5px;
        overflow: hidden;
        min-width: 140px;
        background: #e3e8f0;
      }
      .barra i {
        display: block;
        height: 100%;
      }
      .leg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        font-size: 13px;
        color: #4a5670;
        margin-top: 12px;
      }
      .leg em {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .k-o {
        background: #1c9c76;
      }
      .k-b {
        background: #4fb3e8;
      }
      .k-s {
        background: #f2c14e;
      }
      .k-r {
        background: #e0525f;
      }
      .nota {
        font-size: 13px;
        color: #4a5670;
        line-height: 1.55;
      }
      .nota li {
        margin-bottom: 6px;
      }
      .mini {
        display: inline-block;
        height: 10px;
        border-radius: 3px;
        background: #1f3c72;
        vertical-align: middle;
        margin-right: 8px;
      }
      @media (max-width: 600px) {
        .topo {
          padding: 14px 16px;
        }
        main {
          padding: 20px 16px 36px;
        }
        h1 {
          font-size: 24px;
        }
        .card .v {
          font-size: 28px;
        }
      }
      .item {
        display: flex;
        gap: 14px;
        padding: 14px 0;
        border-bottom: 1px solid #e3e8f0;
      }
      .item:last-child {
        border-bottom: 0;
      }
      .dot {
        flex: 0 0 12px;
        height: 12px;
        border-radius: 50%;
        margin-top: 6px;
      }
      .d-erro {
        background: #e0525f;
      }
      .d-atencao {
        background: #f2c14e;
      }
      .d-ok {
        background: #1c9c76;
      }
      .item b {
        display: block;
        font-size: 16px;
      }
      .item small {
        display: block;
        color: #4a5670;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 700;
      }
      .item p {
        margin: 4px 0 0;
        color: #4a5670;
        font-size: 14px;
        line-height: 1.5;
      }
      .item ul {
        margin: 8px 0 0;
        padding-left: 18px;
        color: #4a5670;
        font-size: 13px;
        line-height: 1.6;
      }
      .pill.sit-Atingida {
        background: #c7ecd9;
        color: #0f5a41;
      }
      .pill.sit-No {
        background: #fbf0d3;
        color: #6e4700;
      }
      .pill.sit-Crítica {
        background: #f8d9dc;
        color: #8a1b2a;
      }
      .pill {
        margin-left: 0;
        font-size: 14px;
        padding: 5px 12px;
      }
      .resumo {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .btn2 {
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        color: #1f3c72;
        border: 2px solid #1f3c72;
        background: #fff;
        border-radius: 10px;
        padding: 8px 16px;
        cursor: pointer;
      }
      .cat {
        margin-bottom: 18px;
      }
      .cat h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .cat .g {
        font-size: 12px;
        font-weight: 700;
        color: #4a5670;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 6px 0;
        font-size: 14px;
        line-height: 1.4;
      }
      .chk input {
        width: 20px;
        height: 20px;
        margin-top: 1px;
        flex: 0 0 20px;
      }
      .todos {
        font-size: 13px;
        font-weight: 700;
        color: #1f3c72;
        background: none;
        border: 0;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
        margin-left: 8px;
      }
      .rev {
        background: #fbf0d3;
        border: 2px solid #f2c14e;
        border-radius: 14px;
        padding: 18px 20px;
        margin: 20px 0;
      }
      .rev ul {
        margin: 6px 0 10px;
        padding-left: 18px;
        font-size: 14px;
      }
      .btn1 {
        font: inherit;
        font-weight: 800;
        font-size: 15px;
        color: #fff;
        background: #1f3c72;
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        cursor: pointer;
      }
      .btn1:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>

  <body>
    <header>
      <div class="topo">
        <span class="marca"><img src="/img/painelaps.svg" alt="" width="34" height="34" /><span>Painel APS · Cajamar</span></span>
      </div>
    </header>
    <main>
      <h1>Indicadores da Atenção Primária</h1>
      <p class="intro">
        Totais agregados da Atenção Primária à Saúde de Cajamar, divulgados pela Secretaria de Saúde. Não há dados de pacientes nem nomes de
        profissionais. <span id="quando"></span>
      </p>
      <div id="conteudo" aria-live="polite"><span class="carr">Carregando…</span></div>
    </main>
    <script src="/js/catalogo-indicadores.js"></script>
    <script src="/js/estadual-regras.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const pct = (v) => (v == null ? '—' : (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%');
      const num = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 }));
      const T = {
        meta: {
          c: ['Meta', 'Indicador', 'Alvo', 'Acumulado', 'Situação'],
          l: (i) => i.linhas.map((x) => [x.meta, x.ind, num(x.alvo), num(x.acum), x.sit]),
        },
        vacina: {
          c: ['Vacina', 'Meta', '2025', 'Jan–ago/2026', 'Jan–set/2026'],
          l: (i) => [[i.linhas.v, pct(i.linhas.metaPAS), pct(i.linhas.d25), pct(i.linhas.ago), pct(i.linhas.set)]],
        },
        conceito: {
          c: ['Quadrimestre', 'Equipe', 'Indicador', 'Ótimo', 'Bom', 'Suficiente', 'Regular'],
          l: (i) => i.linhas.map((x) => [x.q, x.eq, x.nome, x.o, x.b, x.s, x.r]),
        },
        final: {
          c: ['Quadrimestre', 'Equipe', 'Ótimo', 'Bom', 'Suficiente', 'Regular'],
          l: (i) => i.linhas.map((x) => [x.q, x.eq, x.o, x.b, x.s, x.r]),
        },
      };
      const mesN = (c) => {
        const [a, m] = String(c).split('-');
        return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][m - 1] + '/' + a;
      };
      const sel = (id, rot, ops) =>
        '<label>' +
        rot +
        '<select id="' +
        id +
        '">' +
        ops.map((o) => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('') +
        '</select></label>';
      function vivos(v) {
        const alvo = $('#vivos');
        let h = '';
        if (v.federal)
          h +=
            '<section class="bloco" id="s-fed"><div class="nota"><b>Cofinanciamento federal · PEC e-SUS</b></div><h2>Indicadores por unidade e equipe</h2><p class="d">Mês: ' +
            mesN(v.federal.competencia) +
            '. Resultado calculado dos totais coletados; o conceito oficial é o do Ministério da Saúde.</p><div class="sel" id="f-sel"></div><div class="tab" id="f-tab"></div></section>';
        if (v.estadual) h += '<section class="bloco" id="s-est"></section>';
        if (v.filas && v.filas.linhas.length)
          h +=
            '<section class="bloco" id="s-fil"><div class="nota"><b>Filas e faltas</b></div><h2>Absenteísmo e espera por vaga</h2><p class="d">Mês: ' +
            mesN(v.filas.competencia) +
            '. Totais por equipe e especialidade, sem nomes de profissionais.</p><div class="sel" id="q-sel"></div><div class="tab" id="q-tab"></div></section>';
        alvo.innerHTML = h;
        if (v.federal) federal(v.federal);
        if (v.estadual) estadual(v.estadual);
        if (v.filas && v.filas.linhas.length) filas(v.filas);
      }
      function federal(F) {
        const cat = window.CATALOGO || {};
        const uns = [...new Set(F.linhas.map((l) => l.u).filter((u) => u && u !== 'Município'))].sort();
        $('#f-sel').innerHTML =
          sel('f-un', 'Unidade', [['', 'Município (todas)']].concat(uns.map((u) => [u, u]))) + sel('f-eq', 'Equipe', [['', 'Todas']]);
        const des = () => {
          const un = $('#f-un').value,
            eq = $('#f-eq').value;
          const eqs = [
            ...new Set(
              F.linhas
                .filter((l) => !un || l.u === un)
                .map((l) => l.e)
                .filter(Boolean),
            ),
          ].sort();
          const ant = $('#f-eq').value;
          $('#f-eq').innerHTML =
            '<option value="">Todas</option>' +
            eqs.map((e) => '<option' + (e === ant ? ' selected' : '') + '>' + esc(e) + '</option>').join('');
          const q = $('#f-eq').value;
          const m = new Map();
          F.linhas
            .filter((l) => (un ? l.u === un : l.u !== 'Município') && (!q || l.e === q))
            .forEach((l) => {
              const g = m.get(l.c) || { c: l.c, n: 0, d: 0, p: 0 };
              g.n += l.n;
              g.d += l.d;
              g.p += l.p;
              m.set(l.c, g);
            });
          // C7 (itens A a D, pesos 20/30/30/20) e CVAT (escores de cadastro e acompanhamento) são notas compostas, como no painel interno.
          if (['A', 'B', 'C', 'D'].some((x) => m.get('C7-' + x))) {
            let n = 0;
            [
              ['A', 20],
              ['B', 30],
              ['C', 30],
              ['D', 20],
            ].forEach(([x, pe]) => {
              const g = m.get('C7-' + x);
              if (g && g.d) n += (g.n / g.d) * pe;
            });
            m.set('C7', { c: 'C7', direto: n });
          }
          const cad = m.get('CVAT-CAD'),
            aco = m.get('CVAT-ACO');
          if (cad && aco) {
            const f = (v, e) => (v > 85 ? e[0] : v >= 65 ? e[1] : v >= 45 ? e[2] : e[3]);
            const ic = cad.d ? (100 * cad.n) / cad.d : 0,
              ia = aco.d ? (100 * aco.n) / aco.d : 0;
            m.set('CVAT', { c: 'CVAT', direto: f(ic, [3, 2.25, 1.5, 0.75]) + f(ia, [7, 5.25, 3.5, 1.75]) });
          }
          const lin = [...m.values()]
            .filter((g) => cat[g.c] && cat[g.c].tipo !== 'contagem' && (g.direto !== undefined || !/-/.test(g.c)))
            .sort((a, b) => a.c.localeCompare(b.c, 'pt', { numeric: true }));
          const res = (g, t) =>
            g.direto !== undefined
              ? g.direto
              : t === 'pontos'
                ? g.d
                  ? g.p / g.d
                  : null
                : t === 'percentual'
                  ? g.d
                    ? (100 * g.n) / g.d
                    : null
                  : t === 'razao'
                    ? g.d
                      ? g.n / g.d
                      : null
                    : null;
          $('#f-tab').innerHTML = lin.length
            ? '<table><thead><tr><th>Indicador</th><th class="n">Numerador</th><th class="n">Denominador</th><th class="n">Resultado</th></tr></thead><tbody>' +
              lin
                .map((g) => {
                  const c = cat[g.c],
                    v = res(g, c.tipo);
                  return (
                    '<tr><td><b>' +
                    esc(g.c) +
                    '</b> · ' +
                    esc(c.nome) +
                    '</td><td class="n">' +
                    (g.direto !== undefined ? '—' : num(g.n)) +
                    '</td><td class="n">' +
                    (g.direto !== undefined ? '—' : num(g.d)) +
                    '</td><td class="n">' +
                    (v == null ? '—' : num(v) + (c.tipo === 'percentual' ? '%' : '')) +
                    '</td></tr>'
                  );
                })
                .join('') +
              '</tbody></table>'
            : '<p class="nota">Sem dados para esta escolha.</p>';
        };
        $('#f-un').addEventListener('change', () => {
          $('#f-eq').value = '';
          des();
        });
        $('#f-eq').addEventListener('change', des);
        des();
      }
      function estadual(E) {
        const R = window.ESTADUAL_REGRAS;
        const el = $('#s-est');
        if (!R) {
          el.remove();
          return;
        }
        const PARC = [
          { p: '2025-Q3', ant: '2025-Q2' },
          { p: '2026-Q1', ant: '2025-Q3' },
          { p: '2026-Q2', ant: '2026-Q1' },
        ];
        const L = E.lancamentos,
          vig = (i, p) => L.find((l) => l.item === i && l.periodo === p) || null;
        const P = [...PARC].reverse().find((x) => L.some((l) => l.periodo === x.p));
        if (!P) {
          el.remove();
          return;
        }
        const NQ = (p) => {
          const [a, q] = p.split('-Q');
          return q + 'º quadrimestre de ' + a;
        };
        const linhas = R.ITENS.map((it) => {
          const l = vig(it.id, P.p),
            a = vig(it.id, P.ant);
          const d = {
            valor: l ? l.valor : null,
            anterior: l && l.anterior != null ? l.anterior : a ? a.valor : null,
            mediana: l ? l.mediana : null,
            quartil: l ? l.quartil : null,
            quartilAnt: l && l.quartilAnt != null ? l.quartilAnt : a ? a.quartil : null,
          };
          if (it.tipo === 'esf') {
            d.nEsf = l ? l.valor : null;
            d.valor = d.nEsf;
          }
          return { it, r: R.pontuar(it, d, R.POP) };
        });
        const ob = vig('obito_materno', P.p);
        const nota = R.nota(
          linhas.map((x) => ({ peso: x.it.peso, pct: x.r.pct })),
          ob ? ob.valor === 0 : undefined,
        );
        el.innerHTML =
          '<div class="nota"><b>Cofinanciamento estadual · IGM SUS Paulista</b></div><h2>Nota da parte variável: ' +
          num(nota.final * 100) +
          '%</h2><p class="d">' +
          NQ(P.p) +
          ', comparado com o ' +
          NQ(P.ant) +
          '. Indicadores sem dado lançado ainda não contam pontos. O valor oficial é o da Secretaria de Estado da Saúde.</p><div class="tab"><table><thead><tr><th>Indicador</th><th class="n">Peso</th><th class="n">Resultado</th><th class="n">Pontos</th></tr></thead><tbody>' +
          linhas
            .map(
              (x) =>
                '<tr><td>' +
                esc(x.it.nome) +
                '</td><td class="n">' +
                num(x.it.peso) +
                '</td><td class="n">' +
                (x.r.pct == null ? 'sem dado' : Math.round(x.r.pct * 100) + '%') +
                '</td><td class="n">' +
                (x.r.pct == null ? '—' : num(x.it.peso * x.r.pct)) +
                '</td></tr>',
            )
            .join('') +
          '</tbody></table></div>';
      }
      function filas(Q) {
        const uns = [...new Set(Q.linhas.map((l) => l.u))].sort(),
          cats = [...new Set(Q.linhas.map((l) => l.cat))];
        $('#q-sel').innerHTML =
          sel('q-un', 'Unidade', [['', 'Todas']].concat(uns.map((u) => [u, u]))) +
          (cats.length > 1 ? sel('q-ct', 'Categoria', [['', 'Médicos e enfermeiros']].concat(cats.map((c) => [c, c + 's']))) : '');
        const des = () => {
          const un = $('#q-un').value,
            ct = $('#q-ct') ? $('#q-ct').value : '';
          const l = Q.linhas.filter((x) => (!un || x.u === un) && (!ct || x.cat === ct));
          $('#q-tab').innerHTML = l.length
            ? '<table><thead><tr><th>Unidade · equipe</th><th>Categoria</th><th>Especialidade</th><th class="n">Faltas</th><th class="n">Atendimentos</th><th class="n">% de faltas</th><th class="n">Dias até a vaga</th></tr></thead><tbody>' +
              l
                .map((x) => {
                  const t = (x.f || 0) + (x.a || 0);
                  return (
                    '<tr><td>' +
                    esc(x.u) +
                    (x.e ? ' · ' + esc(x.e) : '') +
                    '</td><td>' +
                    esc(x.cat) +
                    '</td><td>' +
                    esc(String(x.cbo || '').replace(/\s*-\s*\d+$/, '')) +
                    '</td><td class="n">' +
                    num(x.f) +
                    '</td><td class="n">' +
                    num(x.a) +
                    '</td><td class="n">' +
                    (t ? num((100 * (x.f || 0)) / t) + '%' : '—') +
                    '</td><td class="n">' +
                    (x.lidas ? (x.semVaga && x.semVaga === x.lidas ? 'sem vaga' : x.dias == null ? '—' : num(x.dias)) : '—') +
                    '</td></tr>'
                  );
                })
                .join('') +
              '</tbody></table>'
            : '<p class="nota">Sem dados para esta escolha.</p>';
        };
        $('#q-un').addEventListener('change', des);
        if ($('#q-ct')) $('#q-ct').addEventListener('change', des);
        des();
      }
      (async () => {
        try {
          const r = await fetch('/api/v1/publico/dados');
          if (!r.ok) throw 0;
          const d = await r.json();
          $('#quando').textContent = 'Atualizado em ' + new Date(d.geradoEm).toLocaleDateString('pt-BR') + '.';
          const vv = d.vivos || {};
          if (!d.categorias.length && !Object.keys(vv).length) {
            $('#conteudo').innerHTML = '<section class="bloco">Nenhum indicador foi publicado ainda.</section>';
            return;
          }
          $('#conteudo').innerHTML =
            d.categorias
              .map((c) => {
                const t = T[c.tipo];
                if (!t) return '';
                const linhas = c.itens
                  .flatMap((i) => t.l(i).map((r) => '<tr>' + r.map((x) => '<td>' + esc(x) + '</td>').join('') + '</tr>'))
                  .join('');
                return (
                  '<section class="bloco"><div class="nota"><b>' +
                  esc(c.grupo) +
                  '</b></div><h2>' +
                  esc(c.nome) +
                  '</h2><div class="tab"><table><thead><tr>' +
                  t.c.map((x) => '<th>' + x + '</th>').join('') +
                  '</tr></thead><tbody>' +
                  linhas +
                  '</tbody></table></div></section>'
                );
              })
              .join('') + '<div id="vivos"></div>';
          vivos(vv);
        } catch {
          $('#conteudo').textContent = 'Não foi possível carregar os indicadores agora.';
        }
      })();
    </script>
  </body>
</html>
