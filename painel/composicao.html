<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel APS · Composição</title>
  <link rel="icon" href="/img/painelaps.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/painelaps.css">
  <style>
    :root { --no: var(--surface); --fio: #B8C4D4; --alerta: #8A5A00; --alerta-bg: #FBF0D3; --chip: #EAF1F8; }
    @media (prefers-color-scheme: dark) { :root { --fio: #4B5D6E; --alerta: #F3D27A; --alerta-bg: #3A2F12; --chip: #283247; } }
    header { background: #1F3C72; color: #fff; border-bottom: 4px solid #00A7E7; }
    .w { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
    .logo img { width: 30px; height: 30px; } .logo b { font-size: 17px; }
    .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .nav > a { color: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 99px; padding: 3px 10px; text-decoration: none; }
    main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 26px; font-weight: 800; color: var(--primary); margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; max-width: 760px; }
    .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .ctl input[type=search] { height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--field); color: var(--ink); font: inherit; min-width: 220px; flex: 1 1 220px; max-width: 360px; }
    .ctl select { width: auto; height: 36px; }
    .ctl button { height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 0 12px; font: 600 13px var(--ff); cursor: pointer; }
    .ctl button[aria-pressed=true] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .tag { font-size: 12px; font-weight: 700; background: var(--alerta-bg); color: var(--alerta); border-radius: 99px; padding: 3px 10px; }
    .rolo { overflow-x: auto; padding: 6px 2px 16px; }
    /* Árvore da esquerda para a direita: cada nó é um cartão; os filhos abrem ao lado, ligados por fios. */
    .arv, .arv ul { list-style: none; margin: 0; padding: 0; }
    .arv li { display: flex; align-items: flex-start; position: relative; }
    .arv ul { display: flex; flex-direction: column; gap: 8px; margin-left: 36px; position: relative; }
    .arv ul::before { content: ""; position: absolute; left: -36px; top: 21px; width: 18px; border-top: 2px solid var(--fio); }
    .arv ul > li::before { content: ""; position: absolute; left: -18px; top: 21px; width: 18px; border-top: 2px solid var(--fio); }
    .arv ul > li::after { content: ""; position: absolute; left: -18px; top: -8px; bottom: 0; border-left: 2px solid var(--fio); }
    .arv ul > li:first-child::after { top: 21px; }
    .arv ul > li:last-child::after { bottom: auto; height: 31px; }
    .arv ul > li:only-child::after { display: none; }
    .no { flex: 0 0 auto; width: 250px; background: var(--no); border: 1px solid var(--line); border-radius: 10px; padding: 0; text-align: left; color: var(--ink); font: inherit; }
    .no > button { all: unset; box-sizing: border-box; display: flex; gap: 8px; align-items: center; width: 100%; min-height: 42px; padding: 7px 10px; cursor: pointer; border-radius: 10px; }
    .no > button:focus-visible { outline: 3px solid #00A7E7; outline-offset: 2px; }
    .no.folha > button { cursor: default; }
    .no .seta { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--primary); }
    .no.folha .seta { visibility: hidden; width: 0; }
    .no .txt { min-width: 0; flex: 1; }
    .no b { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .no small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
    .no .al { flex: 0 0 auto; background: var(--alerta-bg); color: var(--alerta); font-size: 11px; font-weight: 800; border-radius: 99px; padding: 2px 7px; }
    .no ul.avisos { list-style: disc; margin: 0; padding: 0 10px 8px 28px; display: block; font-size: 12px; color: var(--alerta); }
    .no ul.avisos::before, .no ul.avisos li::before, .no ul.avisos li::after { display: none; }
    .no ul.avisos li { display: list-item; }
    .n0 { border-color: var(--primary); border-width: 2px; } .n0 b { color: var(--primary); font-size: 15px; }
    .n1 { border-left: 5px solid #1F3C72; } .n2 { border-left: 5px solid #00A7E7; } .n3 { border-left: 5px solid #1C9C76; width: 230px; } .n4 { width: 220px; border-style: dashed; }
    .chip { display: inline-block; font-size: 10.5px; font-weight: 800; background: var(--chip); color: var(--primary); border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
    .vazio { color: var(--muted); padding: 24px 0; }
    mark { background: #FFE58A; color: #1B2340; border-radius: 3px; }
  </style>
</head>
<body>
  <header><div class="w">
    <a class="logo" href="/"><img src="/img/painelaps.svg" alt=""><b>Painel APS</b></a>
    <div class="nav"><a href="/">Notas</a><div class="barra-usuario" id="barra"></div></div>
  </div></header>
  <main>
    <h1>Composição das equipes</h1>
    <p class="sub" id="sub">Do município ao profissional. Clique num cartão para abrir o próximo nível; o selo amarelo mostra quantos pontos de atenção há ali dentro.</p>
    <div class="ctl">
      <select id="comp" aria-label="Competência" hidden></select>
      <input type="search" id="busca" placeholder="Buscar unidade, equipe, categoria ou profissional" aria-label="Buscar">
      <button type="button" id="so" aria-pressed="false">Só com pontos de atenção</button>
      <button type="button" id="abrir">Expandir tudo</button>
      <button type="button" id="fechar">Recolher</button>
      <span class="tag" id="exemplo" hidden>Exemplo · dados fictícios</span>
    </div>
    <div class="rolo"><ul class="arv" id="arv"></ul></div>
  </main>
  <script src="/js/sessao.js"></script>
  <script src="/js/composicao.js"></script>
</body>
</html>
